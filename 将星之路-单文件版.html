<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>将星之路 · 军事生涯模拟</title>
<style>
/* 《将星之路》样式表 —— 浅色主题 */

:root {
  --bg: #f6f5f1;
  --bg-alt: #efeee8;
  --surface: #ffffff;
  --surface-2: #faf9f6;
  --border: #e2dfd5;
  --border-strong: #cdc9bc;
  --text: #23221e;
  --text-2: #5f5c53;
  --text-3: #8d897c;
  --olive: #3f5a3a;
  --olive-2: #55744d;
  --olive-soft: #e8ede4;
  --gold: #a8842f;
  --gold-soft: #f5edd8;
  --red: #a63a2e;
  --red-soft: #f8e8e5;
  --blue: #35618f;
  --blue-soft: #e6eef7;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 1px 2px rgba(35, 34, 30, 0.05);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }
h1, h2, h3, h4 { font-weight: 500; }

#app {
  max-width: 1240px;
  margin: 0 auto;
  padding: 18px 20px 40px;
}

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 14px 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}

.brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.brand-mark {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--olive);
  position: relative;
  flex-shrink: 0;
}
.brand-mark::after {
  content: "";
  position: absolute; inset: 9px;
  background: var(--gold);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.brand-text h1 { font-size: 17px; letter-spacing: 1px; }
.brand-text p { font-size: 11px; color: var(--text-3); letter-spacing: 2px; }

.career { display: flex; align-items: center; gap: 18px; flex: 1; flex-wrap: wrap; }
.career-item { display: flex; flex-direction: column; line-height: 1.3; }
.career-item .k { font-size: 11px; color: var(--text-3); }
.career-item .v { font-size: 15px; font-weight: 500; }
.career-item .v.rank { color: var(--olive); }

.topbar-actions { display: flex; gap: 8px; flex-shrink: 0; }

.btn {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  border-radius: 8px;
  padding: 7px 14px;
  font-size: 13px;
  transition: all 0.15s;
}
.btn:hover { background: var(--bg-alt); }
.btn.ghost { border-color: var(--border); color: var(--text-2); }
.btn.primary {
  background: var(--olive); border-color: var(--olive); color: #fff;
}
.btn.primary:hover { background: var(--olive-2); }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger:hover { opacity: 0.88; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.lg { padding: 11px 20px; font-size: 14px; }

/* ---------- 功勋条 ---------- */
.merit-wrap { margin-top: 12px; }
.merit-track {
  height: 8px; background: var(--bg-alt);
  border-radius: 99px; overflow: hidden;
  border: 1px solid var(--border);
}
.merit-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--olive), var(--gold));
  transition: width 0.4s ease;
}
.merit-label {
  display: flex; justify-content: space-between;
  font-size: 11.5px; color: var(--text-3); margin-top: 5px;
}

/* ---------- 布局 ---------- */
.layout {
  display: grid;
  grid-template-columns: 292px 1fr;
  gap: 16px;
  margin-top: 16px;
  align-items: start;
}

.sidebar { display: flex; flex-direction: column; gap: 14px; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-head {
  padding: 11px 15px;
  border-bottom: 1px solid var(--border);
  font-size: 12px; letter-spacing: 1px;
  color: var(--text-2);
  display: flex; justify-content: space-between; align-items: center;
  background: var(--surface-2);
}
.card-body { padding: 14px 15px; }

/* ---------- 属性 ---------- */
.stat-row { margin-bottom: 11px; }
.stat-row:last-child { margin-bottom: 0; }
.stat-top {
  display: flex; justify-content: space-between;
  font-size: 12.5px; margin-bottom: 4px;
}
.stat-top .name { color: var(--text-2); }
.stat-top .val { font-weight: 500; font-variant-numeric: tabular-nums; }
.stat-track {
  height: 6px; background: var(--bg-alt);
  border-radius: 99px; overflow: hidden;
}
.stat-fill { height: 100%; border-radius: 99px; transition: width 0.35s; }
.stat-fill.attr { background: var(--olive); }
.stat-fill.derived { background: var(--blue); }
.stat-fill.disc { background: var(--gold); }
.stat-fill.morale { background: #c98a2e; }
.stat-fill.health { background: #4b8a5c; }
.stat-fill.prestige { background: #8a6bb0; }
.stat-fill.trust { background: #3f7f9a; }
.stat-fill.family { background: #b06b7a; }
.stat-fill.bond { background: #6b8fb0; }
.stat-hint { font-size: 11px; color: var(--text-3); margin-top: 3px; }
.stat-delta { font-size: 11px; color: var(--olive); margin-left: 6px; }

.trait-list { display: flex; flex-wrap: wrap; gap: 6px; }
.trait-chip {
  font-size: 12px; padding: 3px 9px;
  background: var(--gold-soft); color: #7a5f1c;
  border-radius: 99px; border: 1px solid #e6d9b4;
  cursor: help;
}

/* ---------- 主区域 ---------- */
.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.turn-head {
  display: flex; justify-content: space-between; align-items: center;
  gap: 14px; flex-wrap: wrap;
}
.turn-title { font-size: 15px; }
.turn-title .stage { color: var(--olive); font-weight: 500; }
.turn-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }

.ap-box { display: flex; align-items: center; gap: 10px; }
.ap-pips { display: flex; gap: 4px; }
.ap-pip {
  width: 12px; height: 12px; border-radius: 3px;
  background: var(--bg-alt); border: 1px solid var(--border-strong);
}
.ap-pip.on { background: var(--olive); border-color: var(--olive); }
.ap-num { font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }

.action-groups { display: flex; flex-direction: column; gap: 14px; }
.action-group-title {
  font-size: 11.5px; color: var(--text-3); letter-spacing: 1px;
  margin-bottom: 8px;
}
.action-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 9px;
}
.action {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 10px 12px;
  transition: all 0.14s;
  position: relative;
}
.action:hover:not(:disabled) {
  border-color: var(--olive-2);
  background: var(--olive-soft);
  transform: translateY(-1px);
}
.action:disabled { opacity: 0.38; cursor: not-allowed; }
.action .a-top {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 8px; margin-bottom: 3px;
}
.action .a-name { font-size: 13.5px; font-weight: 500; }
.action .a-ap { font-size: 11px; color: var(--olive); flex-shrink: 0; }
.action .a-desc { font-size: 11.5px; color: var(--text-3); line-height: 1.45; }
.action .a-count {
  position: absolute; top: 6px; right: 8px;
  font-size: 10px; color: #fff; background: var(--olive);
  border-radius: 99px; padding: 0 6px; line-height: 15px;
}

.log-list { max-height: 260px; overflow-y: auto; }
.log-item {
  font-size: 12.5px; color: var(--text-2);
  padding: 6px 0; border-bottom: 1px dashed var(--border);
  display: flex; gap: 8px;
}
.log-item:last-child { border-bottom: none; }
.log-item .ly { color: var(--text-3); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.log-item.good { color: var(--olive); }
.log-item.bad { color: var(--red); }
.log-item.gold { color: var(--gold); }

/* ---------- 弹窗 ---------- */
.overlay {
  position: fixed; inset: 0;
  background: rgba(35, 34, 30, 0.42);
  display: flex; align-items: center; justify-content: center;
  padding: 24px; z-index: 100;
  animation: fade 0.18s ease;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 620px;
  max-height: 88vh; overflow-y: auto;
  box-shadow: 0 12px 40px rgba(35, 34, 30, 0.18);
  animation: rise 0.2s ease;
}
@keyframes rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal.wide { max-width: 860px; }
.modal-head {
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--border);
}
.modal-head .kicker {
  font-size: 11px; letter-spacing: 2px; color: var(--text-3);
  margin-bottom: 5px;
}
.modal-head h2 { font-size: 18px; }
.modal-body { padding: 20px 22px; }
.modal-foot {
  padding: 14px 22px 20px;
  display: flex; gap: 10px; justify-content: flex-end;
  border-top: 1px solid var(--border);
}

.opt {
  display: block; width: 100%; text-align: left;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 13px 15px; margin-bottom: 10px;
  transition: all 0.14s;
}
.opt:hover { border-color: var(--olive-2); background: var(--olive-soft); }
.opt .o-label { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.opt .o-hint { font-size: 12px; color: var(--text-2); }
.opt .o-hint .up { color: var(--olive); }
.opt .o-hint .down { color: var(--red); }
.opt.risky { border-left: 3px solid var(--red); }

/* ---------- 结算 ---------- */
.grade-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 58px; height: 58px; border-radius: 50%;
  font-size: 26px; font-weight: 500; flex-shrink: 0;
}
.grade-S { background: var(--gold-soft); color: var(--gold); border: 2px solid var(--gold); }
.grade-A { background: var(--olive-soft); color: var(--olive); border: 2px solid var(--olive-2); }
.grade-B { background: var(--blue-soft); color: var(--blue); border: 2px solid #7ea3c8; }
.grade-C { background: var(--bg-alt); color: var(--text-2); border: 2px solid var(--border-strong); }
.grade-D { background: var(--red-soft); color: var(--red); border: 2px solid #d09b93; }

.result-head { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.result-head .r-text h3 { font-size: 16px; margin-bottom: 3px; }
.result-head .r-text p { font-size: 12.5px; color: var(--text-3); }

.reward-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.reward {
  font-size: 12.5px; padding: 5px 11px; border-radius: 99px;
  background: var(--olive-soft); color: var(--olive);
  border: 1px solid #cfdcc6;
}
.reward.bad { background: var(--red-soft); color: var(--red); border-color: #e8c9c3; }
.reward.gold { background: var(--gold-soft); color: #7a5f1c; border-color: #e6d9b4; }

.narrative {
  font-size: 13.5px; color: var(--text-2); line-height: 1.75;
  padding: 14px 16px; background: var(--surface-2);
  border-left: 3px solid var(--border-strong);
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-bottom: 16px;
}

/* ---------- 技能树 ---------- */
.branch { margin-bottom: 20px; }
.branch:last-child { margin-bottom: 0; }
.branch-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 9px;
}
.branch-head h3 { font-size: 14px; }
.branch-head span { font-size: 11.5px; color: var(--text-3); }
.skill-list { display: flex; flex-direction: column; gap: 6px; }
.skill-row {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface-2);
}
.skill-row .s-name { flex: 1; font-size: 13px; }
.skill-lv {
  display: flex; gap: 3px; flex-shrink: 0;
}
.skill-lv i {
  width: 16px; height: 16px; border-radius: 4px;
  background: var(--bg-alt); border: 1px solid var(--border-strong);
  font-style: normal; font-size: 10px; line-height: 14px; text-align: center;
  color: var(--text-3);
}
.skill-lv i.on { background: var(--olive); border-color: var(--olive); color: #fff; }
.skill-row .s-cost { font-size: 12px; color: var(--text-3); width: 62px; text-align: right; flex-shrink: 0; }
.skill-row .s-btn { flex-shrink: 0; }
.skill-row .s-btn button {
  border: 1px solid var(--border-strong); background: var(--surface);
  border-radius: 7px; padding: 4px 12px; font-size: 12px;
}
.skill-row .s-btn button:hover:not(:disabled) { background: var(--olive-soft); border-color: var(--olive-2); }
.skill-row .s-btn button:disabled { opacity: 0.35; cursor: not-allowed; }

/* ---------- 履历 ---------- */
.timeline { position: relative; padding-left: 22px; }
.timeline::before {
  content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px;
  width: 1px; background: var(--border-strong);
}
.tl-item { position: relative; padding-bottom: 14px; }
.tl-item:last-child { padding-bottom: 0; }
.tl-item::before {
  content: ""; position: absolute; left: -21px; top: 6px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--border-strong);
}
.tl-item.rank::before { border-color: var(--olive); background: var(--olive); }
.tl-item.gold::before { border-color: var(--gold); background: var(--gold); }
.tl-item.bad::before { border-color: var(--red); background: var(--red); }
.tl-year { font-size: 11px; color: var(--text-3); }
.tl-text { font-size: 13px; }

/* ---------- 角色创建 ---------- */
.setup-name { margin-bottom: 20px; }
.setup-name label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; }
.setup-name input {
  width: 100%; padding: 10px 13px; font-size: 14px;
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  background: var(--surface-2); color: var(--text); font-family: inherit;
}
.setup-name input:focus { outline: none; border-color: var(--olive-2); background: #fff; }

.alloc-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 12px;
}
.alloc-head h3 { font-size: 14px; }
.alloc-head .pts { font-size: 13px; color: var(--olive); font-weight: 500; }
.alloc-row {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 0; border-bottom: 1px dashed var(--border);
}
.alloc-row:last-of-type { border-bottom: none; }
.alloc-row .an { width: 52px; font-size: 13.5px; flex-shrink: 0; }
.alloc-row .ad { flex: 1; font-size: 11.5px; color: var(--text-3); }
.alloc-ctrl { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.alloc-ctrl button {
  width: 26px; height: 26px; border-radius: 7px;
  border: 1px solid var(--border-strong); background: var(--surface);
  font-size: 15px; line-height: 1; color: var(--text-2);
}
.alloc-ctrl button:hover:not(:disabled) { background: var(--olive-soft); border-color: var(--olive-2); }
.alloc-ctrl button:disabled { opacity: 0.3; cursor: not-allowed; }
.alloc-ctrl .av { width: 30px; text-align: center; font-weight: 500; font-variant-numeric: tabular-nums; }

.trait-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.trait-opt {
  border: 1px solid var(--border); background: var(--surface-2);
  border-radius: var(--radius); padding: 9px 12px; text-align: left;
  transition: all 0.14s; max-width: 100%;
}
.trait-opt:hover { border-color: var(--olive-2); }
.trait-opt.on { border-color: var(--olive); background: var(--olive-soft); }
.trait-opt .t-name { font-size: 13px; font-weight: 500; margin-bottom: 2px; }
.trait-opt .t-desc { font-size: 11.5px; color: var(--text-3); }

/* ---------- 结局 ---------- */
.ending-hero {
  text-align: center; padding: 30px 20px 24px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
}
.ending-hero .e-kicker { font-size: 11px; letter-spacing: 3px; color: var(--text-3); margin-bottom: 12px; }
.ending-hero h2 { font-size: 26px; margin-bottom: 8px; letter-spacing: 2px; }
.ending-hero .e-rank { font-size: 13px; color: var(--text-2); }
.ending-hero .e-star {
  width: 52px; height: 52px; margin: 0 auto 16px;
  background: var(--gold);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.ending-hero.tier-warn .e-star { background: var(--red); }
.ending-hero.tier-plain .e-star { background: var(--border-strong); }

.summary-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px; margin-bottom: 18px;
}
.summary-cell {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 11px 13px;
}
.summary-cell .sc-k { font-size: 11px; color: var(--text-3); margin-bottom: 3px; }
.summary-cell .sc-v { font-size: 16px; font-weight: 500; }

/* ---------- 空状态 ---------- */
.empty {
  text-align: center; padding: 40px 20px; color: var(--text-3);
  font-size: 13px;
}

/* ================= 新增：肩章 / 位次 / 机会卡 / 任务推演 ================= */

.career-item .v.good { color: var(--olive); }
.career-item .v.bad { color: var(--red); }
.insignia { margin-left: auto; flex-shrink: 0; }

/* 机会卡 */
.action.opp {
  border-color: #d9c68a;
  background: linear-gradient(180deg, #fdf8ea, #faf3e0);
}
.action.opp:hover:not(:disabled) { border-color: var(--gold); background: #faf1d9; }
.action.opp .a-name { color: #7a5f1c; }

/* 提示行 */
.hint-line { font-size: 11.5px; color: var(--text-3); margin-top: 10px; line-height: 1.6; }

/* 任务推演：部署 */
.deploy-bar {
  display: flex; align-items: baseline; gap: 6px;
  padding: 10px 14px; margin-bottom: 14px;
  background: var(--olive-soft); border-radius: var(--radius);
  font-size: 13px; color: var(--olive);
}
.deploy-bar .deploy-left { font-size: 22px; font-weight: 500; }
.deploy-bar .deploy-total { color: var(--text-3); font-size: 12px; }

.fronts { display: flex; flex-direction: column; gap: 14px; }
.front {
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; background: var(--surface-2);
}
.front-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.front-name { font-size: 13.5px; font-weight: 500; }
.front-hint { font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
.front-track {
  height: 8px; background: var(--bg-alt); border-radius: 99px;
  overflow: hidden; margin-top: 10px; border: 1px solid var(--border);
}
.front-fill {
  height: 100%; background: #b9a05c; border-radius: 99px;
  transition: width 0.25s ease;
}
.front-fill.full { background: var(--olive); }

.preview {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin-top: 16px;
}
.preview-item {
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 10px 12px;
  display: flex; flex-direction: column; gap: 3px;
}
.preview-item .pk { font-size: 11px; color: var(--text-3); }
.preview-item .pv { font-size: 17px; font-weight: 500; }
.preview-item .pv.grade-S { color: var(--gold); }
.preview-item .pv.grade-A { color: var(--olive); }
.preview-item .pv.grade-B { color: var(--blue); }
.preview-item .pv.grade-C { color: var(--text-2); }
.preview-item .pv.grade-D { color: var(--red); }

.need-tag {
  font-size: 11px; padding: 1px 7px; border-radius: 99px;
  background: var(--olive-soft); color: var(--olive);
}
.need-tag.no { background: var(--red-soft); color: var(--red); }

/* 任务结算 */
.fronts-mini { display: flex; flex-direction: column; gap: 7px; margin-bottom: 16px; }
.front-mini { display: flex; align-items: center; gap: 10px; }
.front-mini .fm-name { font-size: 12px; color: var(--text-2); width: 84px; flex-shrink: 0; }
.front-mini .front-track { flex: 1; margin-top: 0; }
.front-mini .fm-val { font-size: 12px; color: var(--text-3); width: 38px; text-align: right; flex-shrink: 0; }

/* ============================================================
   《将星之路》游戏引擎
   时间轴 / 状态 / 行动 / 机会卡 / 同期竞争 / 任务推演 / 晋升 / 结局
   ============================================================ */

/* ---------- 时间轴 ---------- */
const TIMELINE = (function () {
  const seq = [];
  STAGE_ORDER.forEach(k => {
    const st = STAGES[k];
    const years = st.to - st.from + 1;
    if (st.turns === years * 2) {
      for (let i = 0; i < st.turns; i++) {
        const y = st.from + Math.floor(i / 2);
        const half = i % 2 === 0 ? '上半年' : '下半年';
        seq.push({ stage:k, idx:i, year:y, label:'第 ' + y + ' 年 · ' + half, short:'第' + y + '年' });
      }
    } else {
      for (let i = 0; i < st.turns; i++) {
        const y = st.from + i;
        seq.push({ stage:k, idx:i, year:y, label:'第 ' + y + ' 年', short:'第' + y + '年' });
      }
    }
  });
  return seq;
})();

/* ---------- 工具 ---------- */
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function ri(a, b) { return Math.floor(rnd(a, b + 1)); }

const ATTR_NAME = {}; ATTRS.forEach(a => ATTR_NAME[a.key] = a.name);
const DV_NAME = { military:'军事素养', political:'政治素养', professional:'专业能力', discipline:'作风纪律' };
const ST_NAME = { morale:'士气', health:'健康', prestige:'威望', trust:'首长信任', bond:'搭档默契', family:'家庭' };

/* ---------- 纪律等级（阶跃函数，一票否决） ---------- */
function discGrade(v) {
  if (v >= 88) return { name: '优秀', mul: 1.15, freeze: false };
  if (v >= 75) return { name: '良好', mul: 1.00, freeze: false };
  if (v >= 62) return { name: '合格', mul: 0.90, freeze: false };
  return { name: '不合格', mul: 0, freeze: true };
}

/* ---------- 特质系数 ---------- */
function traitMul(s, key) {
  let m = 1;
  s.traits.forEach(t => {
    const fx = (TRAIT_MAP[t] || {}).fx;
    if (fx && fx[key]) m += fx[key];
  });
  return Math.max(0.2, m);
}
function traitBonus(s, task) {
  let b = 0;
  s.traits.forEach(t => {
    const fx = (TRAIT_MAP[t] || {}).fx || {};
    if (fx.taskBonus) b += fx.taskBonus;
    if (fx.combatBonus && task.kind === 'combat') b += fx.combatBonus;
    if (fx.contestBonus && task.kind === 'contest') b += fx.contestBonus;
  });
  return b;
}
function traitRisk(s) {
  let r = 0;
  s.traits.forEach(t => {
    const fx = (TRAIT_MAP[t] || {}).fx || {};
    if (fx.riskAdd) r += fx.riskAdd;
  });
  return r;
}

/* ---------- 新游戏 ---------- */
function newGame(name, alloc, traits, opts) {
  const o = opts || {};
  const enlist = ENLIST_TYPES[o.enlist] || ENLIST_TYPES.conscript;
  const motto = o.motto && MOTTOS.find(m => m.id === o.motto) ? MOTTOS.find(m => m.id === o.motto) : null;

  const s = {
    name: name || '无名',
    traits: traits.slice(),
    enlist: enlist.key,
    mottoId: motto ? motto.id : null,
    legacy: !!o.legacy,
    prename: o.prename || '',
    turnIndex: 0,
    year: 1, stage: 'recruit',
    age: 18, serviceYear: 1,
    attr: {}, dv: {}, st: {},
    merit: 0, rankIdx: enlist.startRank || 0, sp: enlist.sp || 0, spSpent: 0, skills: {},
    route: null, routeSwitched: false, routeChosenYear: 0,
    heir: 0, flags: {},
    usedEvents: [],
    notified: {},
    pendingEchoes: [],
    pendingChains: [],
    ap: 8, apMax: 8, usedActions: {},
    opportunities: [],
    rivals: [],
    rankPos: 1, rankTotal: 8, prevRankPos: 1,
    log: [], history: [],
    ended: false, ending: null, endReason: null,
    injuryCount: 0
  };

  ATTRS.forEach(a => { s.attr[a.key] = ATTR_BASE + (alloc[a.key] || 0); });
  s.dv = { military: 0, political: 0, professional: 0, discipline: 66 };
  s.dvBonus = { military: 0, political: 0, professional: 0 };
  STATES.forEach(x => { s.st[x.key] = x.init; });
  SKILL_BRANCHES.forEach(b => b.skills.forEach(k => { s.skills[k.key] = 0; }));

  // 入伍方式的先天修正
  if (enlist.mods) {
    for (const k in enlist.mods) {
      if (k === 'military') s.dvBonus.military += enlist.mods[k];
      else if (s.attr[k] != null) s.attr[k] += enlist.mods[k];
    }
  }
  if (enlist.flags) for (const k in enlist.flags) s.flags[k] = enlist.flags[k];
  s.enlistNeedMul = enlist.needMul || 1;

  // 家训（二周目继承）
  if (motto) {
    if (motto.mods) {
      for (const k in motto.mods) {
        if (k === 'all') ATTRS.forEach(a => { s.attr[a.key] += motto.mods.all; });
        else if (s.attr[k] != null) s.attr[k] += motto.mods[k];
      }
    }
    if (motto.merit) s.merit += motto.merit;
    if (motto.st) for (const k in motto.st) s.st[k] = clamp(s.st[k] + motto.st[k], 0, 100);
    if (motto.disc) s.dv.discipline = clamp(s.dv.discipline + motto.disc, 0, 110);
    if (motto.heirBonus) s.flags.heirBonus = true;
    if (motto.alloc) s.flags.bonusAlloc = motto.alloc;
  }
  if (traits.indexOf('stubborn') >= 0) s.attr.xinnian += 5;

  computeDerived(s);
  initRivals(s);
  initNPCs(s);
  const t = TIMELINE[0];
  s.year = t.year; s.stage = t.stage;
  s.ap = STAGES[s.stage].ap; s.apMax = s.ap;

  pushLog(s, '入伍', '你穿上了新军装，胸前别着大红花。' + (enlist.key !== 'conscript' ? '（' + enlist.name + '）' : ''), 'gold');
  pushHistory(s, '入伍', '以' + enlist.name + '身份入伍，授' + RANKS[s.rankIdx].name + '军衔', 'rank');
  if (motto) {
    pushLog(s, '家风', '你带着「' + motto.name + '」走进了军营。', 'gold');
    pushHistory(s, '继承家训', motto.name + ' —— ' + motto.desc, 'gold');
  }
  return s;
}

function computeDerived(s) {
  const a = s.attr;
  const b = s.dvBonus || { military: 0, political: 0, professional: 0 };
  s.dv.military = clamp((a.tibo * 0.4 + a.tongshuai * 0.4 + a.zhimou * 0.2) + b.military, 0, 110);
  s.dv.political = clamp((a.xinnian * 0.5 + a.meili * 0.3 + a.yizhi * 0.2) + b.political, 0, 110);
  s.dv.professional = clamp((a.zhimou * 0.5 + a.yizhi * 0.3 + a.tibo * 0.2) + b.professional, 0, 110);
}

/* ---------- 同期军官 ---------- */
function initRivals(s) {
  const pool = RIVAL_NAMES.slice();
  s.rivals = [];
  for (let i = 0; i < 7; i++) {
    const name = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    s.rivals.push({
      name: name,
      tag: RIVAL_TAGS[Math.floor(Math.random() * RIVAL_TAGS.length)],
      power: rnd(0.82, 1.18),
      merit: 0
    });
  }
}

function tickRivals(s) {
  const base = RIVAL_GAIN[s.stage] || 300;
  s.rivals.forEach(r => { r.merit += base * r.power * rnd(0.82, 1.18); });
}

function rivalRankIdx(merit) {
  let idx = 0;
  for (let i = 0; i < RANKS.length; i++) if (merit >= RANKS[i].need) idx = i;
  return idx;
}

/* ============================================================
   具名 NPC 关系网
   ============================================================ */
function mkNpcName(used) {
  for (let i = 0; i < 300; i++) {
    const n = NPC_SURNAMES[ri(0, NPC_SURNAMES.length - 1)] + NPC_GIVEN[ri(0, NPC_GIVEN.length - 1)];
    if (used.indexOf(n) < 0 && n !== '无名') { used.push(n); return n; }
  }
  return '无名';
}

function initNPCs(s) {
  const used = [];
  const mk = (id, role, aff, growth) => ({
    id: id, role: role, name: mkNpcName(used),
    tag: NPC_TAGS[ri(0, NPC_TAGS.length - 1)],
    affinity: aff, growth: growth == null ? 0 : growth, active: true
  });
  s.npcs = [
    mk('chief',   'chief',       55),
    mk('partner', 'partner',     50),
    mk('com1',    'comrade',     45),
    mk('com2',    'comrade',     38),
    mk('sub1',    'subordinate', 45, 22),
    mk('sub2',    'subordinate', 40, 10)
  ];
  pushHistory(s, '结识同袍',
    s.npcs.map(n => NPC_ROLES[n.role].name + ' ' + n.name).join('　'), '');
}

function npcByRole(s, role) { return (s.npcs || []).filter(n => n.role === role && n.active); }

function avgAffinity(s, role) {
  const list = npcByRole(s, role);
  if (!list.length) return 0;
  return list.reduce((n, x) => n + x.affinity, 0) / list.length;
}

function addAffinity(s, role, v) {
  (s.npcs || []).forEach(n => {
    if (n.role !== role || !n.active) return;
    n.affinity = clamp(n.affinity + v, 0, 100);
  });
}

/* 每回合的 NPC 演化：好感度淡化、部属成长、关系转化为士气 */
function npcTick(s) {
  if (!s.npcs) return;
  s.npcs.forEach(n => {
    if (!n.active) return;
    n.affinity = clamp(n.affinity - 0.35, 0, 100);
    if (n.role === 'subordinate') {
      let g = rnd(0.7, 1.9);
      if (hasS(s, 'daibing')) g *= 1.7;
      if (s.flags.heirBonus) g *= 1.6;
      if (n.affinity >= 60) g *= 1.2;
      n.growth = Math.min(120, (n.growth || 0) + g);
      if (n.growth >= 100 && !n.graduated) {
        n.graduated = true;
        applyEffects(s, { merit: 500, st: { prestige: 3 } });
        pushLog(s, '部属提干', n.name + ' 通过了提干考核，成了排长。', 'gold');
        pushHistory(s, '部属提干', n.name + ' 通过提干考核，成了排长', 'gold');
      }
    }
  });
  if (avgAffinity(s, 'comrade') >= 65) s.st.morale = clamp(s.st.morale + 0.8, 0, 100);
  if (avgAffinity(s, 'subordinate') >= 65) s.st.morale = clamp(s.st.morale + 0.6, 0, 100);
}

/* 把 NPC 事件模板实例化到具体的人身上 */
function pickNpcEvent(s) {
  if (!s.npcs || !s.npcs.length) return null;
  const si = stageIndex(s.stage);
  const cands = [];
  s.npcs.forEach(n => {
    if (!n.active) return;
    NPC_EVENTS.forEach(t => {
      if (t.role !== n.role) return;
      if (si < (t.min || 0)) return;
      if (s.usedEvents.indexOf(t.id + ':' + n.id) >= 0) return;
      if (t.cond && !t.cond(s, n)) return;
      cands.push({ tpl: t, npc: n });
    });
  });
  if (!cands.length) return null;
  if (Math.random() > 0.2) return null;

  let total = 0; cands.forEach(c => total += c.tpl.weight);
  let r = Math.random() * total;
  let pick = cands[cands.length - 1];
  for (const c of cands) { r -= c.tpl.weight; if (r <= 0) { pick = c; break; } }

  const t = pick.tpl, n = pick.npc;
  const fill = txt => (txt || '').replace(/\{name\}/g, n.name);
  return {
    id: t.id + ':' + n.id,
    title: fill(t.title),
    text: fill(t.text),
    npcEvent: true,
    npcRole: n.role,
    options: t.options.map(o => ({
      label: fill(o.label),
      hint: o.hint,
      fx: o.fx,
      flag: o.flag,
      risky: o.risky,
      npc: n,
      npcFx: o.npcFx
    }))
  };
}

/* 玩家在同批人中的位次 */
function myRank(s) {
  let better = 0;
  (s.rivals || []).forEach(r => { if (r.merit > s.merit) better++; });
  const total = (s.rivals || []).length + 1;
  return { pos: better + 1, total: total, better: better, pct: total > 1 ? better / (total - 1) : 0 };
}

/* ---------- 效果应用 ---------- */
function applyEffects(s, fx, scale) {
  const k = scale == null ? 1 : scale;
  const changes = [];
  if (!fx) return changes;

  if (fx.attr) {
    for (const key in fx.attr) {
      const raw = fx.attr[key] * k;
      const before = s.attr[key];
      s.attr[key] = clamp(before + raw, 0, ATTR_CAP);
      const d = s.attr[key] - before;
      if (Math.abs(d) > 0.05) changes.push({ label: ATTR_NAME[key], v: d });
    }
  }

  if (fx.dv) {
    for (const key in fx.dv) {
      let raw = fx.dv[key] * k;
      if (key === 'discipline') {
        raw *= traitMul(s, 'discMul');
        if (raw > 0) raw *= Math.pow(Math.max(0, 1 - s.dv.discipline / 110), 1.1);
        const before = s.dv[key];
        s.dv[key] = clamp(before + raw, 0, 110);
        const d = s.dv[key] - before;
        if (Math.abs(d) > 0.05) changes.push({ label: DV_NAME[key], v: d });
      } else {
        // 军事素养 / 政治素养 / 专业能力 由属性推导，行动带来的增量单独累计
        if (!s.dvBonus) s.dvBonus = { military: 0, political: 0, professional: 0 };
        if (key === 'political') raw *= traitMul(s, 'politicalMul');
        const before = s.dv[key];
        if (raw > 0) {
          const headroom = Math.max(0, 1 - before / 110);
          raw *= Math.pow(headroom, 1.4);
        }
        s.dvBonus[key] = Math.max(-60, (s.dvBonus[key] || 0) + raw);
        computeDerived(s);
        const d = s.dv[key] - before;
        if (Math.abs(d) > 0.05) changes.push({ label: DV_NAME[key], v: d });
      }
    }
  }

  if (fx.st) {
    for (const key in fx.st) {
      let raw = fx.st[key] * k;
      if (key === 'trust') raw *= traitMul(s, 'trustMul');
      if (key === 'prestige') raw *= traitMul(s, 'prestigeMul');
      if (key === 'bond') raw *= traitMul(s, 'bondMul');
      if (raw > 0 && key !== 'health') {
        raw *= Math.pow(Math.max(0, 1 - s.st[key] / 100), 0.6);
      }
      const before = s.st[key];
      s.st[key] = clamp(before + raw, 0, 100);
      const d = s.st[key] - before;
      if (Math.abs(d) > 0.05) changes.push({ label: ST_NAME[key], v: d });
    }
  }

  if (fx.merit) {
    let raw = fx.merit * k;
    if (raw > 0) raw *= traitMul(s, 'meritMul');
    s.merit = Math.max(0, s.merit + raw);
    if (Math.abs(raw) > 0.5) changes.push({ label: '功勋', v: raw });
  }

  if (fx.sp) {
    const v = Math.round(fx.sp * k);
    s.sp += v;
    if (v) changes.push({ label: '技能点', v: v });
  }

  if (fx.heir) {
    const chance = s.flags && s.flags.heirBonus ? 0.6 : 0.3;
    if (s.heir < 3 && Math.random() < chance) {
      s.heir += 1;
      changes.push({ label: '培养接班人', v: 1 });
    }
  }

  if (fx.flag) s.flags[fx.flag] = true;

  computeDerived(s);
  return changes;
}

/* ---------- 日志 / 履历 ---------- */
function pushLog(s, title, text, kind) {
  s.log.unshift({ year: s.year, stage: STAGES[s.stage].name, title, text, kind: kind || '' });
  if (s.log.length > 300) s.log.pop();
}
function pushHistory(s, title, text, kind) {
  s.history.push({ year: s.year, age: s.age, title, text, kind: kind || '' });
}

/* ---------- 回合 ---------- */
function currentTurn(s) { return TIMELINE[s.turnIndex]; }

function beginTurn(s) {
  s.apMax = STAGES[s.stage].ap;
  s.ap = s.apMax;
  s.usedActions = {};
  drawOpportunities(s);
  s.prevRankPos = myRank(s).pos;
}

/* 抽机会卡 */
function drawOpportunities(s) {
  const si = stageIndex(s.stage);
  const pool = OPPORTUNITIES.filter(o => si >= o.min);
  const copy = pool.slice();
  const picked = [];
  for (let i = 0; i < 3 && copy.length; i++) {
    picked.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
  }
  s.opportunities = picked.map(o => o.id);
}

function findAction(id) {
  return ACTIONS.find(a => a.id === id)
    || ROUTE_ACTIONS.find(a => a.id === id)
    || OPPORTUNITIES.find(o => o.id === id);
}

function availableActions(s) {
  const si = stageIndex(s.stage);
  const base = ACTIONS.filter(a =>
    si >= a.min && (a.reqRank == null || s.rankIdx >= a.reqRank));
  const routeActs = s.route
    ? ROUTE_ACTIONS.filter(a => a.route === s.route && si >= a.min)
    : [];
  const opps = (s.opportunities || []).map(id => OPPORTUNITIES.find(o => o.id === id)).filter(Boolean);
  return base.concat(routeActs).concat(opps);
}

/* 重大功勋数量（大元帅的必要条件） */
function greatDeeds(s) {
  return GREAT_DEED_FLAGS.reduce((n, f) => n + (s.flags[f] ? 1 : 0), 0);
}

/* ---------- 路线 ---------- */
function skillBranchOf(skillKey) {
  for (const b of SKILL_BRANCHES) {
    if (b.skills.some(k => k.key === skillKey)) return b.key;
  }
  return null;
}

/* 本路线对应技能分支的升级消耗享受折扣 */
function skillCost(s, skillKey, nextLv) {
  const base = SKILL_COST[nextLv];
  if (!base) return base;
  if (s.route && skillBranchOf(skillKey) === ROUTES[s.route].branch) {
    return Math.max(1, base - 1);
  }
  return base;
}

function chooseRoute(s, key) {
  if (!ROUTES[key]) return false;
  s.route = key;
  s.routeChosenYear = s.year;
  const r = ROUTES[key];
  pushLog(s, '选定路线', '你选择了' + r.name + '——' + r.motto, 'gold');
  pushHistory(s, '选择' + r.name, r.desc, 'rank');
  s.st.prestige = clamp(s.st.prestige + 3, 0, 100);
  return true;
}

function switchRoute(s, key) {
  if (!ROUTES[key] || s.routeSwitched || key === s.route) return { ok: false };
  const cost = ROUTE_SWITCH_COST;
  if (s.merit < cost.merit) return { ok: false, reason: '功勋不足（需 ' + cost.merit + '）' };
  s.merit -= cost.merit;
  s.st.prestige = clamp(s.st.prestige - cost.prestige, 0, 100);
  const from = ROUTES[s.route];
  s.route = key;
  s.routeSwitched = true;
  pushLog(s, '转线', '由' + from.name + '转为' + ROUTES[key].name + '，付出不小代价', 'bad');
  pushHistory(s, '转线至' + ROUTES[key].name, '中途调整了成长方向', 'bad');
  return { ok: true };
}

/* 路线的晋升指标要求（少将 / 中将 / 上将） */
function routeGateMiss(s, nextIdx) {
  if (!s.route) return [];
  const r = ROUTES[s.route];
  const tier = nextIdx - 16;                    // 16→0, 17→1, 18→2
  if (tier < 0 || tier > 2) return [];
  const miss = [];
  const cur = s.dv[r.stat];
  if (cur < r.gateNeeds[tier]) miss.push(r.statName + ' ' + Math.round(cur) + '/' + r.gateNeeds[tier]);
  const ex = s.dv[r.extraKey] != null ? s.dv[r.extraKey] : s.attr[r.extraKey];
  if (ex != null && ex < r.extraNeeds[tier]) miss.push(r.extraName + ' ' + Math.round(ex) + '/' + r.extraNeeds[tier]);
  return miss;
}

/* 行动收益系数：行动点压缩到 5~7 之后，单次行动的收益相应放大，
   让每一回合"选择更少、但每一次更有分量"。 */
const ACTION_SCALE = 1.6;

function doAction(s, id) {
  const a = findAction(id);
  if (!a) return { ok: false };
  if (s.ap < a.ap) return { ok: false, reason: '行动点不足' };
  const used = s.usedActions[id] || 0;
  if (used >= 2) return { ok: false, reason: '本回合已达上限' };

  s.ap -= a.ap;
  s.usedActions[id] = used + 1;
  const scale = Math.pow(0.8, used) * ACTION_SCALE;
  const changes = applyEffects(s, a.fx, scale);
  // 行动会作用到具体的人，而不再只是抽象数值
  const nf = ACTION_NPC_AFFINITY[id];
  if (nf) addAffinity(s, nf.role, nf.v * scale);
  // 冲击大元帅的成就标记
  if (id === 'grandBid') s.flags.achGrandBid = true;
  return { ok: true, changes: changes, action: a, scale: scale };
}

/* 由效果数据自动生成行动描述，保证说明与实际结算永远一致 */
function fmtNum(v) {
  const r = Math.round(v * 10) / 10;
  return (r > 0 ? '+' : '') + (Math.abs(r % 1) < 0.05 ? Math.round(r) : r.toFixed(1));
}
function describeFx(fx, k) {
  if (!fx) return '';
  const kk = k == null ? 1 : k;
  const parts = [];
  if (fx.attr) for (const key in fx.attr) parts.push(ATTR_NAME[key] + ' ' + fmtNum(fx.attr[key] * kk));
  if (fx.dv) for (const key in fx.dv) parts.push(DV_NAME[key] + ' ' + fmtNum(fx.dv[key] * kk));
  if (fx.st) for (const key in fx.st) parts.push(ST_NAME[key] + ' ' + fmtNum(fx.st[key] * kk));
  if (fx.merit) parts.push('功勋 ' + fmtNum(fx.merit * kk));
  if (fx.sp) parts.push('技能点 +' + Math.round(fx.sp * kk));
  if (fx.heir) parts.push('培养接班人机会');
  return parts.join(' · ');
}

/* 自动安排行动：按"先补短板、再攒功勋"的动态优先级花掉行动点。
   纪律是晋升硬门槛，跌破阈值时优先补；健康同理；其余行动点用于积累功勋。 */
const MERIT_ACTIONS = ['lead','build','unitBuild','campaign','joint','serviceBuild'];
const FILLER_ACTIONS = ['fitness','study','shoot','command','staff','talk','network','apparatus'];

/* 路线专属行动通常比通用行动更强，排在功勋行动之前 */
function meritActionsFor(s) {
  const base = MERIT_ACTIONS.slice();
  // 上将之后可以主动冲击大元帅（消耗极大，是明确的取舍）
  if (s.rankIdx >= 18) base.unshift('grandBid');
  if (!s.route) return base;
  const routeIds = ROUTE_ACTIONS.filter(a => a.route === s.route).map(a => a.id);
  return routeIds.concat(base);
}

function autoSpendAP(s, opts) {
  const o = opts || {};
  const discTarget = o.discTarget || 78;
  const meritTarget = o.meritTarget || 2;
  let guard = 0;
  let meritDone = 0;
  while (s.ap > 0 && guard++ < 40) {
    let acted = false;

    // 1. 上将阶段：接班人（上将/大元帅的硬条件之一）
    if (stageIndex(s.stage) >= 5 && s.heir < 3 && s.ap >= 2 && (s.usedActions['mentor'] || 0) < 2) {
      if (doAction(s, 'mentor').ok) continue;
    }
    // 2. 纪律低于阈值时补纪律（每次只补 1 点，避免挤占功勋）
    if (s.dv.discipline < discTarget) {
      for (const id of ['drill', 'poledu']) {
        const a = ACTIONS.find(x => x.id === id);
        if (a && a.ap <= s.ap && (s.usedActions[id] || 0) < 1) {
          if (doAction(s, id).ok) { acted = true; break; }
        }
      }
      if (acted) continue;
    }
    // 3. 先保证每回合至少有一次功勋行动（否则晋升会停滞）
    if (meritDone < meritTarget) {
      for (const id of meritActionsFor(s)) {
        const a = findAction(id);
        if (!a || stageIndex(s.stage) < a.min) continue;
        if (a.reqRank != null && s.rankIdx < a.reqRank) continue;
        if (a.ap <= s.ap && (s.usedActions[id] || 0) < 2) {
          if (doAction(s, id).ok) { meritDone++; acted = true; break; }
        }
      }
      if (acted) continue;
    }
    // 4. 机会卡：每回合限定，不用就作废
    for (const id of (s.opportunities || [])) {
      const o = OPPORTUNITIES.find(x => x.id === id);
      if (!o || o.ap > s.ap || (s.usedActions[id] || 0) >= 1) continue;
      const hpCost = (o.fx && o.fx.st && o.fx.st.health) || 0;
      if (hpCost < 0 && s.st.health < 65) continue;
      if (doAction(s, id).ok) { acted = true; break; }
    }
    if (acted) continue;
    // 5. 健康偏低时休息
    if (s.st.health < 80 && s.ap >= 1 && (s.usedActions['rest'] || 0) < 2) {
      if (doAction(s, 'rest').ok) continue;
    }
    // 6. 其余行动点用于补属性
    for (const id of FILLER_ACTIONS) {
      const a = ACTIONS.find(x => x.id === id);
      if (!a || stageIndex(s.stage) < a.min) continue;
      if (a.ap <= s.ap && (s.usedActions[id] || 0) < 2) {
        if (doAction(s, id).ok) { acted = true; break; }
      }
    }
    if (!acted) break;
  }
  return s.ap;
}

/* ---------- 回合结算与推进 ---------- */
function finishTurn(s) {
  settleTurn(s);

  s.turnIndex++;
  if (s.turnIndex >= TIMELINE.length) {
    finishCareer(s, '服役期满');
    return { queue: [], finished: true };
  }
  const t = TIMELINE[s.turnIndex];
  const prevStage = s.stage;
  s.year = t.year; s.stage = t.stage;
  s.age = 18 + (t.year - 1);
  s.serviceYear = t.year;

  const queue = [];

  if (prevStage !== s.stage) {
    const st = STAGES[s.stage];
    pushLog(s, '进入' + st.name, st.desc, 'gold');
    pushHistory(s, '进入' + st.name, st.desc, 'rank');
    queue.push({ type: 'stage', data: st });
  }

  fireEchoes(s, queue);
  fireChains(s, queue);

  // 进入尉官期后仍未定路线，先让玩家做抉择
  if (!s.route && stageIndex(s.stage) >= stageIndex(ROUTE_STAGE)) {
    queue.push({ type: 'route' });
  }

  const ev = pickEvent(s);
  if (ev) queue.push({ type: 'event', data: ev });

  const npcEv = pickNpcEvent(s);
  if (npcEv) queue.push({ type: 'event', data: npcEv });

  const tk = pickTask(s);
  if (tk) queue.push({ type: 'task', data: tk });

  const pr = checkPromotion(s);
  if (pr) queue.push({ type: 'promotion', data: pr });

  return { queue: queue, finished: false };
}

function settleTurn(s) {
  // 同期军官与关系网同步演化
  tickRivals(s);
  npcTick(s);

  // 士气向 55 回归
  const m = s.st.morale;
  s.st.morale = clamp(m + (m > 55 ? -2.0 : m < 55 ? 1.5 : 0), 0, 100);

  // 健康：由年龄决定基准值，再向基准缓慢回归。
  // 负伤与透支会把它打到基准以下，但不会不可逆地一路滑坡。
  let base = 92;
  if (s.age >= 30) base = 88;
  if (s.age >= 38) base = 82;
  if (s.age >= 45) base = 74;
  if (s.age >= 52) base = 65;
  if (s.age >= 58) base = 56;
  if (s.age >= 63) base = 48;
  if (s.st.health < base) s.st.health = Math.min(base, s.st.health + 1.1);
  else s.st.health = Math.max(base, s.st.health - 0.5);
  s.st.health = clamp(s.st.health, 0, 100);

  // 纪律向基准值回归（基准设在"合格"线之上，避免不违纪的玩家被永久锁死）
  // S 级「条令权威」使自然衰减减半
  const DISC_BASE = 66;
  const discDecay = hasS(s, 'tiaoling') ? 0.175 : 0.35;
  if (s.dv.discipline > DISC_BASE) s.dv.discipline = Math.max(DISC_BASE, s.dv.discipline - discDecay);
  else if (s.dv.discipline < DISC_BASE) s.dv.discipline = Math.min(DISC_BASE, s.dv.discipline + 0.5);

  // 威望与首长信任随时间淡化
  s.st.prestige *= 0.972;
  s.st.trust *= 0.975;

  // 派生指标的加成也会随长期荒废而回落
  if (s.dvBonus) {
    ['military', 'political', 'professional'].forEach(k => {
      s.dvBonus[k] = (s.dvBonus[k] || 0) * 0.985;
    });
    computeDerived(s);
  }

  // 家庭与搭档长期不投入会疏远
  s.st.family = clamp(s.st.family - 0.9, 0, 100);
  s.st.bond = clamp(s.st.bond - 0.5, 0, 100);

  s.traits.forEach(t => {
    const fx = (TRAIT_MAP[t] || {}).fx || {};
    if (fx.moraleFloor && s.st.morale < fx.moraleFloor) s.st.morale = fx.moraleFloor;
  });

  computeDerived(s);

  if (s.st.health <= 0) finishCareer(s, '健康原因退役');
}

/* ---------- 事件 ---------- */
function pickEvent(s) {
  const si = stageIndex(s.stage);
  let pool = EVENTS.filter(e =>
    s.usedEvents.indexOf(e.id) < 0 && si >= e.min && si <= e.max
  );
  // 事件链的"起点"同样进入随机池（带 chained 标记的是后续节点，只能由链条触发）
  pool = pool.concat(CHAIN_EVENTS.filter(e =>
    !e.chained && e.weight > 0 && s.usedEvents.indexOf(e.id) < 0 && si >= e.min && si <= e.max
  ));
  // 二周目专属事件
  if (s.legacy) {
    pool = pool.concat(LEGACY_EVENTS.filter(e => s.usedEvents.indexOf(e.id) < 0 && si >= e.min && si <= e.max));
  }
  if (!pool.length) return null;
  if (Math.random() > 0.36) return null;

  let total = 0;
  pool.forEach(e => total += e.weight);
  let r = Math.random() * total;
  for (const e of pool) {
    r -= e.weight;
    if (r <= 0) return e;
  }
  return pool[pool.length - 1];
}

/* 把事件文本里的占位符换成真实姓名 */
function fillNames(s, text) {
  if (!text) return '';
  return text
    .replace(/\{prename\}/g, s.prename || '父辈')
    .replace(/\{name\}/g, s.name);
}

function applyOption(s, ev, opt) {
  s.usedEvents.push(ev.id);
  const changes = applyEffects(s, opt.fx);
  let hiddenNote = null;
  let hiddenChanges = [];
  if (opt.hidden && Math.random() < opt.hidden.chance) {
    hiddenChanges = applyEffects(s, opt.hidden);
    hiddenNote = opt.hidden.note;
  }
  if (opt.flag) s.flags[opt.flag] = true;
  if (opt.risky) s.flags.riskyCount = (s.flags.riskyCount || 0) + 1;

  // NPC 事件：改变具体 NPC 的好感度与履历
  if (opt.npc && opt.npcFx) {
    if (opt.npcFx.affinity) opt.npc.affinity = clamp(opt.npc.affinity + opt.npcFx.affinity, 0, 100);
    if (opt.npcFx.growth) opt.npc.growth = Math.max(0, (opt.npc.growth || 0) + opt.npcFx.growth);
    if (opt.npcFx.inactive) opt.npc.active = false;
  }

  // 事件链：安排后续事件
  if (opt.chain && opt.chain.id) {
    if (!s.pendingChains) s.pendingChains = [];
    s.pendingChains.push({ at: s.turnIndex + (opt.chain.delay || 2), id: opt.chain.id });
  }

  pushLog(s, ev.title, opt.label + (hiddenNote ? '（' + hiddenNote + '）' : ''), hiddenNote ? 'bad' : '');
  return { changes: changes, hiddenChanges: hiddenChanges, hiddenNote: hiddenNote };
}

/* ---------- 事件链 ---------- */
function fireChains(s, queue) {
  if (!s.pendingChains || !s.pendingChains.length) return;
  const due = [];
  s.pendingChains = s.pendingChains.filter(c => {
    if (c.at <= s.turnIndex) { due.push(c); return false; }
    return true;
  });
  due.forEach(c => {
    const ev = CHAIN_EVENTS.find(e => e.id === c.id);
    if (ev && s.usedEvents.indexOf(ev.id) < 0) queue.push({ type: 'event', data: ev });
  });
}

function fireEchoes(s, queue) {
  const due = [];
  s.pendingEchoes = s.pendingEchoes.filter(e => {
    if (e.at <= s.turnIndex) { due.push(e); return false; }
    return true;
  });
  ECHO_RULES.forEach(r => {
    if (s.flags[r.flag] && !s.flags['echo_' + r.flag]) {
      s.flags['echo_' + r.flag] = true;
      s.pendingEchoes.push({ at: s.turnIndex + r.after, rule: r });
    }
  });
  due.forEach(e => {
    applyEffects(s, e.rule.fx);
    pushLog(s, '往事回响', e.rule.text, 'gold');
    queue.push({ type: 'echo', data: e.rule });
  });
}

/* ---------- 任务 ---------- */
function pickTask(s) {
  const si = stageIndex(s.stage);
  const pool = TASKS.filter(t => si >= t.min && si <= t.max);
  if (!pool.length) return null;
  if (Math.random() > 0.5) return null;

  let total = 0;
  pool.forEach(t => total += t.weight);
  let r = Math.random() * total;
  for (const t of pool) {
    r -= t.weight;
    if (r <= 0) return t;
  }
  return pool[pool.length - 1];
}

/* S 级高级指令带来的加成 */
function skillSBonus(s, task) {
  let mul = 1, riskAdd = 0;
  if (task.layer === '单兵层' && hasS(s, 'sheji')) mul += 0.12;
  if (task.layer === '战役层' && hasS(s, 'canmou')) mul += 0.08;
  if (task.layer === '战略层' && hasS(s, 'dongyuan')) mul += 0.10;
  if (hasS(s, 'daibing')) mul += 0.06;
  if (hasS(s, 'zhencha')) { mul += 0.10; riskAdd += 0.03; }
  return { mul: Math.min(mul, 1.2), riskAdd: riskAdd };   // 上限 +20%
}

/* 部署点：S 级「联合作战指挥」「战时保障」各加 1 点 */
function taskDeployPoints(s, task) {
  let n = task.deploy;
  if (task.layer === '战役层' && hasS(s, 'lianhe')) n += 1;
  if (task.layer === '战略层' && hasS(s, 'houqin')) n += 1;
  return n;
}

/* 创建一次任务推演 */
function createTaskRun(s, task) {
  const alloc = {};
  task.fronts.forEach(f => { alloc[f.key] = 0; });
  return {
    task: task,
    alloc: alloc,
    left: taskDeployPoints(s, task),
    reserveUsed: 0,
    decisions: [],
    decisionLog: []
  };
}

function deployTo(run, key, d) {
  const f = run.task.fronts.find(x => x.key === key);
  if (!f) return false;
  if (d > 0 && run.left <= 0) return false;
  if (d < 0 && run.alloc[key] <= 0) return false;
  run.alloc[key] += d;
  run.left -= d;
  return true;
}

function frontFill(run, key) {
  const f = run.task.fronts.find(x => x.key === key);
  if (!f) return 0;
  return Math.min((run.alloc[key] || 0) / f.demand, 1.25);
}

/* 当前推演的综合预览 */
function taskPreview(s, run) {
  const t = run.task;
  let power = 0;
  (t.attrs || []).forEach(k => { power += (s.attr[k] - ATTR_BASE) * 0.6; });
  power += (s.skills[t.skill] || 0) * 4;
  power += traitBonus(s, t);
  power += (s.st.morale - 50) * 0.2;
  power += (s.st.health - 70) * 0.1;
  power += (s.dv.military - 50) * 0.3;
  power += (s.st.bond - 30) * 0.1;
  // 路线加成：任务的关键技能属于本路线的技能分支时，判定更强
  if (s.route && skillBranchOf(t.skill) === ROUTES[s.route].branch) power += 9;

  let dScore = 0, dRisk = 0;
  run.decisions.forEach(d => { dScore += d.score || 0; dRisk += d.risk || 0; });

  // 主攻战线的收益是边际递减的（堆满主攻收益有限），保障战线线性削减风险，
  // 预备队解锁更优的突发选项——三条线各有各的用处，但部署点不够全都要。
  // 战力系数做了压缩（0.8 + power/150），避免后期无脑拿 S。
  const mainFill = frontFill(run, 'main');
  const mainCurve = Math.pow(mainFill, 0.7);
  const powerFactor = 0.8 + power / 150;
  const sb = skillSBonus(s, t);
  const score = 62 * (0.6 + 0.4 * mainCurve) * powerFactor * (1 + dScore) * sb.mul;
  let risk = Math.max(0, t.risk * (1 - 0.75 * frontFill(run, 'support')) + dRisk + traitRisk(s) + sb.riskAdd);
  if (hasS(s, 'zuzhi')) risk *= 0.94;
  return { score: score, power: power, risk: risk, fill: {
    main: mainFill,
    support: frontFill(run, 'support'),
    reserve: frontFill(run, 'reserve')
  }};
}

function gradeOf(score) {
  if (score >= 100) return 'S';
  if (score >= 86) return 'A';
  if (score >= 68) return 'B';
  if (score >= 46) return 'C';
  return 'D';
}

const GRADE_MUL = { S: 1.8, A: 1.4, B: 1.0, C: 0.55, D: 0.15 };

/* 结算一次任务推演 */
function resolveTaskRun(s, run) {
  const t = run.task;
  const pv = taskPreview(s, run);
  const score = pv.score * rnd(0.92, 1.08);
  const grade = gradeOf(score);

  const merit = Math.round(t.merit * GRADE_MUL[grade]);
  const spGain = grade === 'S' ? 3 : grade === 'A' ? 2 : grade === 'B' ? 1 : 0;

  const result = {
    task: t, grade: grade, score: Math.round(score), merit: merit, sp: spGain,
    prestige: 0, morale: 0, health: 0, injury: null, dead: false,
    narrative: '', preview: pv, decisions: run.decisionLog.slice()
  };

  applyEffects(s, { merit: merit, sp: spGain });

  // 成就追踪
  if (grade === 'S') s.flags.achS = (s.flags.achS || 0) + 1;
  if (grade === 'D') s.flags.achD = (s.flags.achD || 0) + 1;

  if (grade === 'S') {
    result.prestige = 4; result.morale = 4;
    applyEffects(s, { st: { prestige: 4, morale: 4 }, dv: { military: 3 } });
    result.narrative = '你打得非常漂亮。导调组当场点名表扬，这一仗足够写进你的档案。';
  } else if (grade === 'A') {
    result.prestige = 2; result.morale = 2;
    applyEffects(s, { st: { prestige: 2, morale: 2 }, dv: { military: 2 } });
    result.narrative = '任务完成得出色，上级对你的评价又高了一层。';
  } else if (grade === 'B') {
    applyEffects(s, { st: { morale: 1 } });
    result.narrative = '任务按计划完成，中规中矩，没有出错。';
  } else if (grade === 'C') {
    applyEffects(s, { st: { morale: -2 } });
    result.morale = -2;
    result.narrative = '磕磕绊绊地完成了，暴露出不少问题。复盘会上你被点了名。';
  } else {
    // S 级「政治动员」：任务失利时的士气损失减半
    const loss = hasS(s, 'sixiang') ? -2.5 : -5;
    applyEffects(s, { st: { morale: loss, trust: -3 }, dv: { military: -1 } });
    result.morale = loss;
    result.narrative = '任务失利。责任不完全在你，但结果就是结果。' + (hasS(s, 'sixiang') ? '好在平时思想工作做得扎实，队伍没有散。' : '');
  }

  // 决断附带的额外效果
  run.decisions.forEach(d => { if (d.fx) applyEffects(s, d.fx); });

  if (t.flag) s.flags[t.flag] = true;

  // 风险判定
  const risk = pv.risk;
  if (Math.random() < risk) {
    const severe = Math.random() < 0.22;
    const hpLoss = severe ? ri(10, 18) : ri(3, 9);
    applyEffects(s, { st: { health: -hpLoss, morale: -3 } });
    s.injuryCount++;
    result.injury = severe ? '重伤' : '轻伤';
    result.health = -hpLoss;
    result.narrative += severe
      ? ' 你在任务中负了重伤，被紧急后送，休养了很久。'
      : ' 你在任务中受了点伤，简单包扎后又回到了队伍里。';
    pushLog(s, t.name, '负伤（' + result.injury + '），健康 −' + hpLoss, 'bad');

    if (severe && s.st.health < 22 && Math.random() < 0.15) {
      result.dead = true;
      s.flags.martyr = true;
      finishCareer(s, '执行任务中牺牲');
      return result;
    }
  }

  pushLog(s, t.name, '评价 ' + grade + '，功勋 +' + merit, grade === 'S' ? 'gold' : grade === 'D' ? 'bad' : 'good');
  pushHistory(s, t.name, '评价 ' + grade + ' · 功勋 +' + merit, grade === 'S' ? 'gold' : '');
  return result;
}

/* 自动部署（供快速推进与模拟器使用）：保障 1 点、预备队 1 点（若够），其余压主攻 */
function autoDeploy(run) {
  const has = k => run.task.fronts.some(f => f.key === k);
  if (has('support')) deployTo(run, 'support', 1);
  if (has('reserve') && run.task.deploy >= 4) deployTo(run, 'reserve', 1);
  const mainKey = has('main') ? 'main' : run.task.fronts[0].key;
  while (run.left > 0) deployTo(run, mainKey, 1);
  return run;
}

/* 自动决断：在可承受范围内选收益最高的 */
function autoDecide(run, decision) {
  let best = null, bestScore = -99;
  decision.options.forEach(o => {
    const need = o.need || 0;
    if (need > run.alloc.reserve - run.reserveUsed) return;
    const s = (o.score || 0) - (o.risk || 0) * 1.2;
    if (s > bestScore) { bestScore = s; best = o; }
  });
  if (!best) best = decision.options[0];
  return best;
}

/* 一步到位的任务结算（供模拟器使用） */
function resolveTask(s, task) {
  const run = autoDeploy(createTaskRun(s, task));
  (task.decisions || []).forEach(d => {
    const opt = autoDecide(run, d);
    run.reserveUsed += (opt.need || 0);
    run.decisions.push(opt);
    run.decisionLog.push({ text: d.text, choice: opt.label });
  });
  return resolveTaskRun(s, run);
}

/* ---------- 晋升（加权和 × 门槛阶跃函数 × 位次修正） ---------- */
function promotionScore(s) {
  const next = RANKS[s.rankIdx + 1];
  if (!next) return null;
  const meritPart = Math.min(s.merit / next.need, 2) * 50;
  const assessPart = clamp(s.dv.military * 0.4 + s.dv.political * 0.2 + s.dv.professional * 0.4, 0, 110) / 110 * 25;
  const matchPart = clamp((s.st.prestige * 0.5 + s.st.trust * 0.5), 0, 100) / 100 * 25;
  const g = discGrade(s.dv.discipline);
  return {
    merit: meritPart, assess: assessPart, match: matchPart,
    total: (meritPart + assessPart + matchPart) * g.mul,
    grade: g
  };
}

/* 同期排名会浮动晋升门槛：位次靠前更容易晋升，靠后更难。
   生长军官因欠缺基层经历，尉官期及以下的门槛额外高 20%。 */
function effectiveNeed(s, nextIdx) {
  const rk = myRank(s);
  let need = RANKS[nextIdx].need * (0.88 + 0.28 * rk.pct);
  if (s.flags && s.flags.no_grassroots && nextIdx <= 11) need *= (s.enlistNeedMul || 1.2);
  return Math.round(need);
}

function checkPromotion(s) {
  if (!s.notified) s.notified = {};
  const nextIdx = s.rankIdx + 1;
  if (nextIdx >= RANKS.length) return null;
  const next = RANKS[nextIdx];
  const cap = STAGES[s.stage].maxRank;
  if (nextIdx > cap) return null;

  const need = effectiveNeed(s, nextIdx);
  if (s.merit < need) return null;

  const g = discGrade(s.dv.discipline);
  if (g.freeze) {
    if (s.notified[nextIdx + ':disc']) return null;
    s.notified[nextIdx + ':disc'] = true;
    return { blocked: true, reason: '作风纪律不合格', from: RANKS[s.rankIdx].name, to: next.name };
  }

  const gate = RANK_GATES[nextIdx];
  if (gate) {
    const miss = [];
    if (gate.prestige && s.st.prestige < gate.prestige) miss.push('威望 ' + Math.round(s.st.prestige) + '/' + gate.prestige);
    if (gate.disc && s.dv.discipline < gate.disc) miss.push('作风纪律 ' + Math.round(s.dv.discipline) + '/' + gate.disc);
    if (gate.heir && (s.heir || 0) < gate.heir) miss.push('培养接班人 ' + (s.heir || 0) + '/' + gate.heir);
    if (gate.deeds && greatDeeds(s) < gate.deeds) miss.push('重大功勋 ' + greatDeeds(s) + '/' + gate.deeds);
    // 路线指标要求
    routeGateMiss(s, nextIdx).forEach(m => miss.push(m));
    if (miss.length) {
      if (s.notified[nextIdx + ':gate']) return null;
      s.notified[nextIdx + ':gate'] = true;
      return { blocked: true, reason: '尚未达到' + next.name + '的综合条件：' + miss.join('、'), from: RANKS[s.rankIdx].name, to: next.name, gateMiss: miss };
    }
  }

  return { blocked: false, from: RANKS[s.rankIdx].name, to: next.name, idx: nextIdx, score: promotionScore(s), need: need };
}

function applyPromotion(s, pr) {
  s.rankIdx = pr.idx;
  s.sp += 2;
  s.st.prestige = clamp(s.st.prestige + 1.5, 0, 100);
  s.st.morale = clamp(s.st.morale + 2, 0, 100);
  pushLog(s, '晋升', '由' + pr.from + '晋升为' + pr.to, 'gold');
  pushHistory(s, '晋升' + pr.to, '由' + pr.from + '晋升为' + pr.to + '，授' + pr.to + '军衔', 'rank');
}

/* ---------- 结局 ---------- */
function finishCareer(s, reason) {
  if (s.ended) return;
  s.ended = true;
  s.endReason = reason;
  const e = ENDINGS.find(x => x.cond(s));
  s.ending = e || ENDINGS[ENDINGS.length - 1];
  pushHistory(s, '生涯结束', reason, 'bad');
  try { commitAchievements(s); commitLegacy(s); } catch (err) {}
}

/* ============================================================
   成就与传承（跨周目持久化）
   ============================================================ */
const ACHV_KEY = 'jiangxing_zhilu_achv_v1';
const LEGACY_KEY = 'jiangxing_zhilu_legacy_v1';

function loadAchv() {
  try {
    const raw = localStorage.getItem(ACHV_KEY);
    const o = raw ? JSON.parse(raw) : null;
    return o && o.unlocked ? o : { unlocked: [], runs: 0 };
  } catch (e) { return { unlocked: [], runs: 0 }; }
}
function saveAchv(a) {
  try { localStorage.setItem(ACHV_KEY, JSON.stringify(a)); } catch (e) {}
}
function resetAchv() {
  try { localStorage.removeItem(ACHV_KEY); localStorage.removeItem(LEGACY_KEY); } catch (e) {}
}

function evaluateAchievements(s) {
  const list = [];
  ACHIEVEMENTS.forEach(a => {
    let ok = false;
    try { ok = !!a.cond(s); } catch (e) { ok = false; }
    if (ok) list.push(a);
  });
  return list;
}

/* 结算时调用：返回本次新解锁的成就 */
function commitAchievements(s) {
  const got = evaluateAchievements(s);
  const store = loadAchv();
  const fresh = got.filter(a => store.unlocked.indexOf(a.id) < 0);
  fresh.forEach(a => store.unlocked.push(a.id));
  store.runs = (store.runs || 0) + 1;
  saveAchv(store);
  s.achievements = got.map(a => a.id);
  s.newAchievements = fresh.map(a => a.id);
  return fresh;
}

/* ---------- 传承 ---------- */
function loadLegacy() {
  try {
    const raw = localStorage.getItem(LEGACY_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveLegacy(rec) {
  try { localStorage.setItem(LEGACY_KEY, JSON.stringify(rec)); } catch (e) {}
}

/* 生涯结束时写入传承记录，供下一周目继承 */
function commitLegacy(s) {
  const prev = loadLegacy();
  const snap = {
    name: s.name,
    rankIdx: s.rankIdx,
    rankName: RANKS[s.rankIdx].name,
    merit: Math.round(s.merit),
    route: s.route,
    ending: s.ending ? s.ending.name : '',
    disc: Math.round(s.dv.discipline),
    heir: s.heir || 0,
    year: s.serviceYear,
    flags: s.flags
  };
  const rec = {
    runs: ((prev && prev.runs) || 0) + 1,
    last: snap,
    best: (prev && prev.best && prev.best.merit > snap.merit) ? prev.best
        : { name: snap.name, merit: snap.merit, rankName: snap.rankName }
  };
  saveLegacy(rec);
  return rec;
}

/* 根据上一世生涯，列出可继承的家训 */
function availableMottos() {
  const rec = loadLegacy();
  if (!rec || !rec.last) return [];
  const p = rec.last;
  return MOTTOS.filter(m => {
    try { return m.cond(p); } catch (e) { return false; }
  });
}

/* 上一世生涯摘要 */
function legacySummary() {
  const rec = loadLegacy();
  if (!rec || !rec.last) return null;
  return rec;
}

/* ================= 军衔肩章 ================= */
function starPath(cx, cy, r) {
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const ang = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r * 0.42;
    pts.push((cx + rr * Math.cos(ang)).toFixed(1) + ',' + (cy + rr * Math.sin(ang)).toFixed(1));
  }
  return 'M' + pts.join('L') + 'Z';
}

function insigniaSVG(rankIdx, w) {
  const ins = RANK_INSIGNIA[rankIdx] || RANK_INSIGNIA[0];
  const W = w || 96, H = 30;
  const isGold = ins.style === 'gold' || ins.style === 'grand';
  const bg = isGold ? '#B8912B' : '#46543F';
  const fg = '#F2EEE2';
  const n = ins.stars;
  const cx0 = W / 2 - (n - 1) * 9;

  let marks = '';
  if (ins.style === 'grand') {
    // 大元帅：金色底板 + 一枚大星 + 两道金边
    marks += `<rect x="2" y="2" width="${W - 4}" height="${H - 4}" rx="5" fill="none" stroke="#FFF3C4" stroke-width="1"/>`;
    marks += `<path d="${starPath(W / 2, H / 2, 9)}" fill="#FFF8E1"/>`;
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;border-radius:6px"><rect width="${W}" height="${H}" rx="6" fill="${bg}"/>${marks}</svg>`;
  }
  if (ins.style === 'star' || ins.style === 'star2') {
    marks += `<rect x="11" y="6" width="4" height="${H - 12}" rx="1" fill="${fg}"/>`;
    if (ins.style === 'star2') marks += `<rect x="${W - 15}" y="6" width="4" height="${H - 12}" rx="1" fill="${fg}"/>`;
  }
  if (ins.style === 'bar' || ins.style === 'bar4') {
    marks += `<rect x="10" y="${H / 2 - 2}" width="${W - 20}" height="4" rx="1" fill="${fg}"/>`;
  }
  if (ins.style === 'chevr') {
    marks += `<path d="M${W / 2 - 14} ${H / 2 + 6} L${W / 2} ${H / 2 - 6} L${W / 2 + 14} ${H / 2 + 6}" fill="none" stroke="${fg}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  for (let i = 0; i < n; i++) {
    marks += `<path d="${starPath(cx0 + i * 18, H / 2, 6)}" fill="${fg}"/>`;
  }
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block;border-radius:6px"><rect width="${W}" height="${H}" rx="6" fill="${bg}"/>${marks}</svg>`;
}

/* ================= 角色创建 ================= */
function renderSetup() {
  const mottos = availableMottos();
  SETUP = { alloc: {}, traits: [], name: '', enlist: 'conscript', motto: mottos.length ? 'm_none' : null };
  ATTRS.forEach(a => { SETUP.alloc[a.key] = 0; });

  $('sidebar').innerHTML = '';

  drawSetup();

function setupAllocMax() {
  const en = ENLIST_TYPES[SETUP.enlist];
  let n = en.alloc;
  if (SETUP.motto) {
    const m = MOTTOS.find(x => x.id === SETUP.motto);
    if (m && m.alloc) n += m.alloc;
  }
  return n;
}

function drawSetup() {
  const en = ENLIST_TYPES[SETUP.enlist];
  const max = setupAllocMax();
  const used = ATTRS.reduce((n, a) => n + SETUP.alloc[a.key], 0);
  const left = max - used;

  const enlistCards = Object.keys(ENLIST_TYPES).map(k => {
    const e = ENLIST_TYPES[k];
    return `<button class="enlist-card ${SETUP.enlist === k ? 'on' : ''}" onclick="setupEnlist('${k}')">
      <div class="ec-name">${e.name}</div>
      <div class="ec-desc">${e.desc}</div>
      <div class="ec-meta">可分配点数 ${e.alloc}${e.sp ? ' · 初始技能点 ' + e.sp : ''}${e.startRank ? ' · 起始军衔 ' + RANKS[e.startRank].name : ''}</div>
    </button>`;
  }).join('');

  const mottos = availableMottos();
  const rec = legacySummary();
  const legacyBlock = mottos.length ? `
    <div class="alloc-head" style="margin-top:22px">
      <h3>继承家训</h3>
      <span class="pts">来自${rec.last.name}（${rec.last.rankName} · ${rec.last.ending}）</span>
    </div>
    <div class="motto-pick">
      ${mottos.map(m => `
        <button class="motto-opt ${SETUP.motto === m.id ? 'on' : ''}" onclick="setupMotto('${m.id}')">
          <div class="mo-name">${m.name}</div>
          <div class="mo-desc">${m.desc}</div>
        </button>`).join('')}
    </div>` : '';

  const allocRows = ATTRS.map(a => {
    const v = SETUP.alloc[a.key];
    const base = ATTR_BASE + v + (en.mods[a.key] || 0);
    const mod = en.mods[a.key] || 0;
    return `
      <div class="alloc-row">
        <div class="an">${a.name}</div>
        <div class="ad">${a.desc}${mod ? ` <b style="color:${mod > 0 ? 'var(--olive)' : 'var(--red)'}">(${mod > 0 ? '+' : ''}${mod})</b>` : ''}</div>
        <div class="alloc-ctrl">
          <button onclick="setupAlloc('${a.key}',-1)" ${v <= 0 ? 'disabled' : ''}>−</button>
          <div class="av">${base}</div>
          <button onclick="setupAlloc('${a.key}',1)" ${(left <= 0 || v >= ATTR_ALLOC_MAX + 4) ? 'disabled' : ''}>+</button>
        </div>
      </div>`;
  }).join('');

  const traitOpts = TRAITS.map(t => `
    <button class="trait-opt ${SETUP.traits.indexOf(t.key) >= 0 ? 'on' : ''}" onclick="setupTrait('${t.key}')">
      <div class="t-name">${t.name}</div>
      <div class="t-desc">${t.desc}</div>
    </button>`).join('');

  $('main').innerHTML = `
    <div class="card">
      <div class="card-head">入伍登记</div>
      <div class="card-body">
        <div class="alloc-head"><h3>入伍方式</h3><span class="pts">${en.name}</span></div>
        <div class="enlist-pick">${enlistCards}</div>

        <div class="setup-name" style="margin-top:20px">
          <label>姓名</label>
          <input id="inName" maxlength="8" placeholder="请输入你的名字" value="${SETUP.name.replace(/"/g, '&quot;')}"
                 oninput="SETUP.name=this.value" />
        </div>

        <div class="alloc-head"><h3>基础属性分配</h3><span class="pts">剩余 ${left} / ${max} 点</span></div>
        ${allocRows}

        <div class="alloc-head" style="margin-top:22px">
          <h3>性格特质（选 3 个）</h3><span class="pts">已选 ${SETUP.traits.length} / 3</span>
        </div>
        <div class="trait-pick">${traitOpts}</div>
        ${legacyBlock}

        <div style="margin-top:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="btn primary lg" onclick="startGame()">应征入伍</button>
          <button class="btn" onclick="setupRandom()">随机分配</button>
          <span style="font-size:12px;color:var(--text-3)">18 岁入伍，52 个回合，从列兵到上将${rec && rec.runs ? '　·　第 ' + (rec.runs + 1) + ' 周目' : ''}</span>
        </div>
      </div>
    </div>`;
}

function setupEnlist(k) {
  SETUP.enlist = k;
  const max = setupAllocMax();
  const used = ATTRS.reduce((n, a) => n + SETUP.alloc[a.key], 0);
  while (used > max) {
    for (const a of ATTRS) {
      if (SETUP.alloc[a.key] > 0) { SETUP.alloc[a.key]--; break; }
    }
    break;
  }
  drawSetup();
}

function setupMotto(id) {
  SETUP.motto = SETUP.motto === id ? null : id;
  drawSetup();
}

function setupAlloc(key, d) {
  const used = ATTRS.reduce((n, a) => n + SETUP.alloc[a.key], 0);
  const max = setupAllocMax();
  const v = SETUP.alloc[key];
  if (d > 0 && (used >= max || v >= ATTR_ALLOC_MAX + 4)) return;
  if (d < 0 && v <= 0) return;
  SETUP.alloc[key] = v + d;
  drawSetup();
}
function setupTrait(key) {
  const i = SETUP.traits.indexOf(key);
  if (i >= 0) SETUP.traits.splice(i, 1);
  else if (SETUP.traits.length < 3) SETUP.traits.push(key);
  drawSetup();
}
function setupRandom() {
  const keys = ATTRS.map(a => a.key);
  ATTRS.forEach(a => { SETUP.alloc[a.key] = 0; });
  let left = setupAllocMax();
  while (left > 0) {
    const k = keys[Math.floor(Math.random() * keys.length)];
    if (SETUP.alloc[k] < ATTR_ALLOC_MAX + 4) { SETUP.alloc[k]++; left--; }
  }
  const pool = TRAITS.map(t => t.key);
  SETUP.traits = [];
  while (SETUP.traits.length < 3) {
    SETUP.traits.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  drawSetup();
}

function startGame() {
  const name = ($('inName') ? $('inName').value : SETUP.name).trim();
  if (!name) { alert('请先输入姓名'); return; }
  if (SETUP.traits.length !== 3) { alert('请选择 3 个性格特质'); return; }
  const used = ATTRS.reduce((n, a) => n + SETUP.alloc[a.key], 0);
  if (used < setupAllocMax()) { alert('还有 ' + (setupAllocMax() - used) + ' 点属性未分配'); return; }

  const rec = legacySummary();
  S = newGame(name, SETUP.alloc, SETUP.traits, {
    enlist: SETUP.enlist,
    motto: SETUP.motto,
    legacy: !!(rec && rec.runs),
    prename: rec && rec.last ? rec.last.name : ''
  });
  $('meritWrap').style.visibility = 'visible';
  beginTurn(S);
  saveGame(S);
  renderAll();
}

function renderTop() {
  const rank = RANKS[S.rankIdx];
  const st = STAGES[S.stage];
  const rk = myRank(S);
  const route = S.route ? ROUTES[S.route] : null;
  const en = ENLIST_TYPES[S.enlist] || ENLIST_TYPES.conscript;
  const motto = S.mottoId ? MOTTOS.find(m => m.id === S.mottoId) : null;
  $('career').innerHTML = `
    <div class="career-item"><span class="k">姓名</span><span class="v">${S.name}${motto ? ` <span class="mini-tag">${motto.name}</span>` : ''}</span></div>
    <div class="career-item"><span class="k">出身</span><span class="v">${en.short}</span></div>
    <div class="career-item"><span class="k">军衔</span><span class="v rank">${rank.name}</span></div>
    <div class="career-item"><span class="k">年龄</span><span class="v">${S.age} 岁</span></div>
    <div class="career-item"><span class="k">阶段</span><span class="v">${st.name}</span></div>
    ${route
      ? `<div class="career-item"><span class="k">路线</span><span class="v" style="color:${route.color}">${route.short}</span></div>`
      : `<div class="career-item"><span class="k">路线</span><span class="v" style="color:var(--text-3)">未定</span></div>`}
    <div class="career-item"><span class="k">同期位次</span><span class="v ${rk.pos <= 2 ? 'good' : rk.pos >= 7 ? 'bad' : ''}">第 ${rk.pos} / ${rk.total}</span></div>
    <div class="insignia">${insigniaSVG(S.rankIdx, 84)}</div>`;

  const next = RANKS[S.rankIdx + 1];
  const capReached = next && (S.rankIdx + 1) > st.maxRank;
  let pct = 100, label = '已达最高军衔';

  if (next && !capReached) {
    const need = effectiveNeed(S, S.rankIdx + 1);
    const cur = rank.need;
    pct = clamp((S.merit - cur) / (need - cur) * 100, 0, 100);
    label = `距 ${next.name} 还需 ${Math.max(0, Math.ceil(need - S.merit))} 功勋`;
    if (need !== next.need) {
      label += rk.pos <= 3 ? '（位次靠前，门槛已下调）' : rk.pos >= 6 ? '（位次偏后，门槛已上调）' : '';
    }
    if (S.merit >= need) {
      const gate = RANK_GATES[S.rankIdx + 1];
      const miss = [];
      if (gate) {
        if (gate.prestige && S.st.prestige < gate.prestige) miss.push(`威望 ${Math.round(S.st.prestige)}/${gate.prestige}`);
        if (gate.disc && S.dv.discipline < gate.disc) miss.push(`纪律 ${Math.round(S.dv.discipline)}/${gate.disc}`);
        if (gate.heir && (S.heir || 0) < gate.heir) miss.push(`接班人 ${S.heir || 0}/${gate.heir}`);
        if (gate.deeds && greatDeeds(S) < gate.deeds) miss.push(`重大功勋 ${greatDeeds(S)}/${gate.deeds}`);
      }
      if (discGrade(S.dv.discipline).freeze) miss.push('作风纪律不合格');
      routeGateMiss(S, S.rankIdx + 1).forEach(m => miss.push(m));
      label = miss.length ? `功勋已达标，尚缺：${miss.join(' · ')}` : `${next.name} 条件已满足，等待授衔`;
    }
  } else if (next && capReached) {
    label = `本阶段最高军衔为 ${RANKS[st.maxRank].name}，功勋继续累积`;
    pct = 100;
  }
  $('meritFill').style.width = pct + '%';
  $('meritLabel').innerHTML = `<span>功勋 ${Math.round(S.merit)}</span><span>${label}</span>`;
}

      <div class="stat-track"><div class="stat-fill ${cls}" style="width:${pct}%"></div></div>

}

  const groupsHTML = CAT_ORDER.filter(c => groups[c]).map(c => `
    <div>
      <div class="action-group-title">${c}${c === '机会' ? ' · 本回合限定，过期作废' : ''}</div>
      <div class="action-grid">
        ${groups[c].map(a => {
          const used = S.usedActions[a.id] || 0;
          const lim = c === '机会' ? 1 : 2;
          const dis = S.ap < a.ap || used >= lim;
          return `
            <button class="action ${c === '机会' ? 'opp' : ''}" ${dis ? 'disabled' : ''} onclick="onAction('${a.id}')">
              <div class="a-top"><span class="a-name">${a.name}</span><span class="a-ap">${a.ap} AP</span></div>
              <div class="a-desc">${describeFx(a.fx, ACTION_SCALE)}</div>
              ${used ? `<span class="a-count">×${used}</span>` : ''}
            </button>`;
        }).join('')}
      </div>
    </div>`).join('');

  const pips = Array.from({ length: S.apMax }, (_, i) => `<span class="ap-pip ${i < S.ap ? 'on' : ''}"></span>`).join('');

  $('main').innerHTML = `
    <div class="card">
      <div class="card-body">
        <div class="turn-head">
          <div>
            <div class="turn-title">${t.label} · <span class="stage">${st.name}</span></div>
            <div class="turn-sub">${st.desc}</div>
          </div>
          <div class="ap-box">
            <span class="ap-num">行动点</span>
            <div class="ap-pips">${pips}</div>
            <span class="ap-num">${S.ap} / ${S.apMax}</span>
            <button class="btn" onclick="onAutoArrange()">自动安排</button>
            <button class="btn primary" onclick="onEndTurn()">结束回合</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <span>本回合安排</span>
        <span>重复同一行动效果递减 · 同期位次 第 ${rk.pos}/${rk.total}</span>
      </div>
      <div class="card-body"><div class="action-groups">${groupsHTML}</div></div>
    </div>

    <div class="card">
      <div class="card-head"><span>生涯日志</span><span>共 ${S.log.length} 条</span></div>
      <div class="card-body">
        <div class="log-list">
          ${S.log.slice(0, 40).map(l => `
            <div class="log-item ${l.kind}">
              <span class="ly">第${l.year}年</span>
              <span><b>${l.title}</b> · ${l.text}</span>
            </div>`).join('') || '<div class="empty">还没有记录。</div>'}
        </div>
      </div>
    </div>`;
}

/* ================= 行动 ================= */
function onAction(id) {
  const r = doAction(S, id);
  if (!r.ok) return;
  renderTop(); renderSidebar(); renderMain();
}
function onAutoArrange() {
  autoSpendAP(S);
  renderTop(); renderSidebar(); renderMain();
}
function onEndTurn() {
  const res = finishTurn(S);
  QUEUE = res.queue || [];
  saveGame(S);
  if (res.finished) { showEnding(); return; }
  processQueue();
}

/* ================= 队列 ================= */
function processQueue() {
  if (S.ended) { showEnding(); return; }
  if (QUEUE.length === 0) {
    beginTurn(S);
    saveGame(S);
    renderAll();
    return;
  }
  const item = QUEUE.shift();
  if (item.type === 'stage') showStage(item.data);
  else if (item.type === 'echo') showEcho(item.data);
  else if (item.type === 'route') showRouteChoice();
  else if (item.type === 'event') showEvent(item.data);
  else if (item.type === 'task') showTask(item.data);
  else if (item.type === 'promotion') showPromotion(item.data);
  else processQueue();
}

/* ================= 成长路线 ================= */
function routeCards() {
  return Object.keys(ROUTES).map(k => {
    const r = ROUTES[k];
    const branch = SKILL_BRANCHES.find(b => b.key === r.branch);
    const acts = ROUTE_ACTIONS.filter(a => a.route === k).map(a => a.name).join(' · ');
    return `
      <button class="route-card" style="border-left-color:${r.color}" onclick="onChooseRoute('${k}')">
        <div class="rc-head">
          <span class="rc-name">${r.name}</span>
          <span class="rc-tag">核心指标：${r.statName} · ${r.extraName}</span>
        </div>
        <div class="rc-desc">${r.desc}</div>
        <div class="rc-line"><b>专属行动</b>${acts}</div>
        <div class="rc-line"><b>技能折扣</b>${branch ? branch.name : ''} 升级消耗 −1 点</div>
        <div class="rc-line"><b>任务加成</b>关键技能属于本路线时判定 +9</div>
        <div class="rc-line"><b>晋升要求</b>少将起需 ${r.statName} ≥ ${r.gateNeeds[0]}、${r.extraName} ≥ ${r.extraNeeds[0]}</div>
        <div class="rc-motto">「${r.motto}」</div>
      </button>`;
  }).join('');
}

function showRouteChoice() {
  openModal(`
    <div class="modal-head">
      <div class="kicker">生涯抉择 · 第 ${S.year} 年</div>
      <h2>选择你的成长路线</h2>
    </div>
    <div class="modal-body">
      <div class="narrative">你从军士成长为军官，接下来要走哪条路，将决定后面三十年的方向。<b>主干一旦定下就基本锁定</b>——中途转线的代价很大。</div>
      <div class="route-list">${routeCards()}</div>
    </div>`, true);
}

function onChooseRoute(key) {
  chooseRoute(S, key);
  closeModal();
  saveGame(S);
  renderAll();
  processQueue();
}

function openRoute() {
  if (!S.route) {
    openModal(`
      <div class="modal-head"><div class="kicker">成长路线</div><h2>尚未选定路线</h2></div>
      <div class="modal-body"><div class="narrative">进入尉官期后会面临路线抉择。</div></div>
      <div class="modal-foot"><button class="btn primary" onclick="closeModal()">关闭</button></div>`);
    return;
  }
  const r = ROUTES[S.route];
  const branch = SKILL_BRANCHES.find(b => b.key === r.branch);
  const acts = ROUTE_ACTIONS.filter(a => a.route === S.route).map(a => a.name).join(' · ');
  const canSwitch = !S.routeSwitched && S.merit >= ROUTE_SWITCH_COST.merit;
  const others = Object.keys(ROUTES).filter(k => k !== S.route).map(k => {
    const o = ROUTES[k];
    return `<button class="route-switch" ${canSwitch ? '' : 'disabled'} onclick="onSwitchRoute('${k}')">
      <span class="rs-name" style="color:${o.color}">转为${o.name}</span>
      <span class="rs-cost">代价：功勋 −${ROUTE_SWITCH_COST.merit} · 威望 −${ROUTE_SWITCH_COST.prestige}</span>
    </button>`;
  }).join('');

  const tierNames = ['少将', '中将', '上将'];
  const gateRows = tierNames.map((n, i) => `
    <div class="route-gate">
      <span class="rg-rank">${n}</span>
      <span class="rg-need">${r.statName} ≥ ${r.gateNeeds[i]}</span>
      <span class="rg-need">${r.extraName} ≥ ${r.extraNeeds[i]}</span>
    </div>`).join('');

  openModal(`
    <div class="modal-head"><div class="kicker">成长路线</div><h2>${r.name}</h2></div>
    <div class="modal-body">
      <div class="narrative">${r.desc}<br>「${r.motto}」</div>
      <div class="route-meta">
        <div class="rm-row"><b>专属行动</b><span>${acts}</span></div>
        <div class="rm-row"><b>技能折扣</b><span>${branch ? branch.name : ''} 升级消耗 −1 点</span></div>
        <div class="rm-row"><b>任务加成</b><span>关键技能属于本路线时判定 +9</span></div>
      </div>
      <h3 style="font-size:13px;margin:18px 0 10px">晋升指标要求</h3>
      <div class="route-gates">${gateRows}</div>
      ${S.routeSwitched
        ? '<div class="hint-line">你已经转过一次线，不能再转了。</div>'
        : `<h3 style="font-size:13px;margin:18px 0 10px">转线（全生涯仅一次）</h3><div class="route-switch-list">${others}</div>`}
    </div>
    <div class="modal-foot"><button class="btn primary" onclick="closeModal()">关闭</button></div>`, true);
}

function onSwitchRoute(key) {
  const r = switchRoute(S, key);
  if (!r.ok) { alert(r.reason || '无法转线'); return; }
  saveGame(S);
  openRoute();
  renderAll();
}

/* ================= 弹窗基础 ================= */
function openModal(html, wide) {
  $('modalRoot').innerHTML = `<div class="overlay"><div class="modal ${wide ? 'wide' : ''}">${html}</div></div>`;
}
function closeModal() { $('modalRoot').innerHTML = ''; }

function rewardChips(changes) {
  if (!changes || !changes.length) return '';
  return changes.filter(c => Math.abs(c.v) >= 0.5).map(c => {
    const v = Math.round(c.v);
    const cls = c.label === '功勋' && v > 0 ? 'gold' : v < 0 ? 'bad' : '';
    return `<span class="reward ${cls}">${c.label} ${v > 0 ? '+' : ''}${v}</span>`;
  }).join('');
}

/* ================= 阶段推进 ================= */
function showStage(st) {
  openModal(`
    <div class="modal-head"><div class="kicker">阶段推进</div><h2>${st.name}</h2></div>
    <div class="modal-body">
      <div class="narrative">${st.desc}</div>
      <div class="reward-list">
        <span class="reward">每回合行动点 ${st.ap}</span>
        <span class="reward">时间粒度：${st.turnLabel}</span>

}

/* ================= 回响 ================= */
function showEcho(rule) {
  const chips = [];
  const fx = rule.fx || {};
  ['attr', 'dv', 'st'].forEach(g => {
    if (!fx[g]) return;
    Object.keys(fx[g]).forEach(k => {
      const name = g === 'attr' ? ATTR_NAME[k] : g === 'dv' ? DV_NAME[k] : ST_NAME[k];
      chips.push({ label: name || k, v: fx[g][k] });
    });
  });
  openModal(`
    <div class="modal-head"><div class="kicker">往事回响</div><h2>因果</h2></div>
    <div class="modal-body">
      <div class="narrative">${rule.text}</div>
      <div class="reward-list">${rewardChips(chips) || '<span class="reward">没有立即显现的变化</span>'}</div>
    </div>
    <div class="modal-foot"><button class="btn primary" onclick="closeModal();processQueue()">继续</button></div>`);
}

/* ================= 事件 ================= */
function showEvent(ev) {
  const opts = ev.options.map((o, i) => `
    <button class="opt ${o.risky ? 'risky' : ''}" onclick="onEventOption(${i})">
      <div class="o-label">${o.label}</div>
      <div class="o-hint">${o.hint || ''}</div>
    </button>`).join('');
  openModal(`
    <div class="modal-head">
      <div class="kicker">抉择 · 第 ${S.year} 年${ev.chained ? ' · 后续' : ''}${ev.legacyOnly ? ' · 家风' : ''}</div>
      <h2>${ev.title}</h2>
    </div>
    <div class="modal-body">
      <div class="narrative">${fillNames(S, ev.text)}</div>
      ${opts}
      <div class="hint-line">提示：括号内为可预期的显性收益与代价；隐藏后果由你的信念、性格与口碑决定。</div>

function onEventOption(i) {
