<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3A5636" />
<meta name="format-detection" content="telephone=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>将星之路 · 军事生涯模拟</title>
<style>
/* 《将星之路》样式表 —— 军令档案 · 响应式（手机 / 桌面 · iOS / Android） */

:root {
  --bg: #f3f2ec;
  --bg-alt: #ebe9e0;
  --surface: #ffffff;
  --surface-2: #faf9f5;
  --border: #e0ddd2;
  --border-strong: #c9c4b4;
  --text: #1f1e1a;
  --text-2: #5a574e;
  --text-3: #878376;
  --olive: #3a5636;
  --olive-2: #4f6f48;
  --olive-soft: #e6ecdf;
  --gold: #9a7a28;
  --gold-soft: #f4ecd6;
  --red: #a13a2e;
  --red-soft: #f7e7e4;
  --blue: #2f5d8c;
  --blue-soft: #e5edf6;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow: 0 1px 2px rgba(31, 30, 26, 0.05), 0 4px 12px rgba(31, 30, 26, 0.04);
  --shadow-lg: 0 12px 40px rgba(31, 30, 26, 0.18);
  --tap: 44px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --font: "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Source Han Sans SC",
    "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  --merit-from: #3a5636;
  --merit-via: #6d7f3a;
  --merit-to: #9a7a28;
  --brand-star: #d4b85a;
}

html.theme-dark {
  --bg: #141613;
  --bg-alt: #1c1f1a;
  --surface: #1a1d18;
  --surface-2: #20241e;
  --border: #2e332b;
  --border-strong: #454b40;
  --text: #e8e6dc;
  --text-2: #b0ada2;
  --text-3: #7a776c;
  --olive: #7faf78;
  --olive-2: #96c08e;
  --olive-soft: #243022;
  --gold: #d4b85a;
  --gold-soft: #2e2818;
  --red: #d07a6e;
  --red-soft: #32201e;
  --blue: #7aa3c8;
  --blue-soft: #1a2530;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
  --merit-from: #6d9a66;
  --merit-via: #8a9a4a;
  --merit-to: #d4b85a;
  --brand-star: #e8d48a;
}

html.theme-dark body {
  color-scheme: dark;
}

html.theme-dark .brand-mark {
  background: radial-gradient(circle at 35% 30%, var(--olive-2), var(--olive));
}

html.theme-dark .action.opp {
  border-color: #5a4a20;
  background: linear-gradient(180deg, #2a2414, #221e12);
}

html.theme-dark .ending-hero {
  background: linear-gradient(180deg, var(--surface-2), var(--gold-soft));
}

html.theme-dark .medal-cell.on {
  background: linear-gradient(180deg, #262418, var(--surface-2));
}

html.theme-dark .merit-fill {
  background: linear-gradient(90deg, var(--merit-from), var(--merit-via), var(--merit-to));
}

html.theme-dark .brand-mark::after {
  background: var(--brand-star);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

body.modal-open { overflow: hidden; touch-action: none; }

button {
  font-family: inherit;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}

input {
  font-family: inherit;
  touch-action: manipulation;
}

h1, h2, h3, h4 { font-weight: 500; line-height: 1.35; }

a { color: var(--olive); }

:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--olive-2);
  outline-offset: 2px;
}

#app {
  max-width: 1240px;
  margin: 0 auto;
  padding:
    calc(14px + var(--safe-t))
    calc(16px + var(--safe-r))
    calc(96px + var(--safe-b))
    calc(16px + var(--safe-l));
}

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}

.topbar-id {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  min-width: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
  min-width: 0;
}

.brand-mark {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--olive-2), var(--olive));
  position: relative;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
}

.brand-mark::after {
  content: "";
  position: absolute;
  inset: 8px;
  background: #d4b85a;
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

.brand-text h1 {
  font-size: 17px;
  letter-spacing: 1.5px;
  font-weight: 600;
}

.brand-text p {
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 2px;
  line-height: 1.3;
}

.career {
  display: flex;
  align-items: center;
  gap: 14px;
  flex: 1;
  flex-wrap: wrap;
  min-width: 0;
}

.career-item {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
  min-width: 0;
}

.career-item .k {
  font-size: 11px;
  color: var(--text-3);
}

.career-item .v {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 12em;
}

.career-item .v.rank { color: var(--olive); }
.career-item .v.good { color: var(--olive); }
.career-item .v.bad { color: var(--red); }

.insignia {
  flex-shrink: 0;
  line-height: 0;
}

.topbar-actions { display: none; }

/* ---------- 底部功能菜单 ---------- */
.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  display: flex;
  gap: 2px;
  padding: 6px 6px calc(6px + var(--safe-b));
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  overflow-x: auto;
  overscroll-behavior-x: contain;
  scrollbar-width: none;
}
.bottom-nav::-webkit-scrollbar { display: none; }

.nav-item {
  flex: 1 0 auto;
  min-width: 52px;
  max-width: 88px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 6px 4px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-3);
  font-size: 11px;
  line-height: 1.2;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: color 0.12s, background 0.12s;
}

.nav-item .nav-ico {
  font-size: 15px;
  line-height: 1;
  opacity: 0.9;
}

.nav-item:active { background: var(--bg-alt); }
.nav-item.on {
  color: var(--olive);
  background: var(--olive-soft);
  font-weight: 600;
}

html.theme-dark .bottom-nav {
  background: color-mix(in srgb, var(--surface) 94%, transparent);
}

@media (min-width: 900px) {
  .bottom-nav {
    left: 50%;
    transform: translateX(-50%);
    width: min(920px, calc(100% - 24px));
    bottom: 10px;
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow-lg);
    padding: 8px 10px;
  }
  .nav-item { max-width: none; }
}

.btn {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 14px;
  font-size: 13px;
  min-height: 36px;
  transition: background 0.14s, border-color 0.14s, transform 0.1s, opacity 0.14s;
}

.btn:hover { background: var(--bg-alt); }
.btn:active { transform: scale(0.98); }
.btn.ghost {
  border-color: var(--border);
  color: var(--text-2);
  background: var(--surface-2);
}
.btn.primary {
  background: var(--olive);
  border-color: var(--olive);
  color: #fff;
  font-weight: 500;
}
.btn.primary:hover { background: var(--olive-2); border-color: var(--olive-2); }
.btn.danger {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.btn.danger:hover { opacity: 0.9; }
.btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.btn.block { width: 100%; }
.btn.lg {
  padding: 12px 22px;
  font-size: 15px;
  min-height: var(--tap);
}

/* ---------- 功勋条 ---------- */
.merit-wrap { margin-top: 12px; }

.merit-track {
  height: 8px;
  background: var(--bg-alt);
  border-radius: 99px;
  overflow: hidden;
  border: 1px solid var(--border);
}

.merit-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--olive), #6d7f3a, var(--gold));
  transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}

.merit-label {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 5px;
  line-height: 1.4;
}

.merit-label span:first-child {
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
}

.merit-label span:last-child {
  text-align: right;
  min-width: 0;
}

/* ---------- 布局 ---------- */
.layout {
  display: grid;
  grid-template-columns: 292px minmax(0, 1fr);
  gap: 16px;
  margin-top: 16px;
  align-items: start;
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.card-head {
  padding: 11px 15px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  letter-spacing: 1px;
  color: var(--text-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  background: linear-gradient(180deg, var(--surface-2), #f6f4ed);
}

.card-body { padding: 14px 15px; }

/* ---------- 属性 ---------- */
.stat-row { margin-bottom: 12px; }
.stat-row:last-child { margin-bottom: 0; }

.stat-top {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  margin-bottom: 4px;
}

.stat-top .name { color: var(--text-2); }
.stat-top .val {
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  font-family: var(--mono);
  font-size: 12px;
}

.stat-track {
  height: 6px;
  background: var(--bg-alt);
  border-radius: 99px;
  overflow: hidden;
}

.stat-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 0.35s ease;
}

.stat-fill.attr { background: var(--olive); }
.stat-fill.derived { background: var(--blue); }
.stat-fill.disc { background: var(--gold); }
.stat-fill.morale { background: #c98a2e; }
.stat-fill.health { background: #4b8a5c; }
.stat-fill.prestige { background: #8a6bb0; }
.stat-fill.trust { background: #3f7f9a; }
.stat-fill.family { background: #b06b7a; }
.stat-fill.bond { background: #6b8fb0; }

.stat-hint {
  font-size: 11px;
  color: var(--text-3);
  margin-top: 3px;
}

.trait-list {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.trait-chip {
  font-size: 12px;
  padding: 4px 10px;
  background: var(--gold-soft);
  color: #7a5f1c;
  border-radius: 99px;
  border: 1px solid #e6d9b4;
  cursor: help;
  line-height: 1.4;
}

/* ---------- 主区域 ---------- */
.main {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

.turn-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px 14px;
  flex-wrap: wrap;
}

.turn-title { font-size: 15px; font-weight: 500; }
.turn-title .stage {
  color: var(--olive);
  font-weight: 600;
}

.turn-sub {
  font-size: 12px;
  color: var(--text-3);
  margin-top: 2px;
}

.ap-box {
  display: flex;
  align-items: center;
  gap: 8px 10px;
  flex-wrap: wrap;
}

.ap-pips { display: flex; gap: 4px; }

.ap-pip {
  width: 12px;
  height: 12px;
  border-radius: 3px;
  background: var(--bg-alt);
  border: 1px solid var(--border-strong);
}

.ap-pip.on {
  background: var(--olive);
  border-color: var(--olive);
}

.ap-num {
  font-size: 13px;
  color: var(--text-2);
  font-variant-numeric: tabular-nums;
}

.action-groups {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.action-group-title {
  font-size: 11.5px;
  color: var(--text-3);
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.action-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 9px;
}

.action {
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 11px 12px;
  min-height: 72px;
  transition: background 0.14s, border-color 0.14s, transform 0.12s;
  position: relative;
  color: inherit;
}

.action:hover:not(:disabled) {
  border-color: var(--olive-2);
  background: var(--olive-soft);
  transform: translateY(-1px);
}

.action:active:not(:disabled) { transform: translateY(0); }
.action:disabled { opacity: 0.38; cursor: not-allowed; }

.action .a-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 3px;
}

.action .a-name {
  font-size: 13.5px;
  font-weight: 500;
}

.action .a-ap {
  font-size: 11px;
  color: var(--olive);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.action .a-desc {
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.45;
}

.action .a-count {
  position: absolute;
  top: 6px;
  right: 8px;
  font-size: 10px;
  color: #fff;
  background: var(--olive);
  border-radius: 99px;
  padding: 0 6px;
  line-height: 15px;
}

.log-list {
  max-height: 280px;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

.log-item {
  font-size: 12.5px;
  color: var(--text-2);
  padding: 7px 0;
  border-bottom: 1px dashed var(--border);
  display: flex;
  gap: 8px;
}

.log-item:last-child { border-bottom: none; }
.log-item .ly {
  color: var(--text-3);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.log-item.good { color: var(--olive); }
.log-item.bad { color: var(--red); }
.log-item.gold { color: var(--gold); }

.disclaimer {
  margin-top: 22px;
  text-align: center;
  font-size: 11px;
  color: var(--text-3);
  line-height: 1.6;
}

/* ---------- 弹窗 ---------- */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(31, 30, 26, 0.48);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
  animation: fade 0.18s ease;
  overscroll-behavior: contain;
}

@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 620px;
  max-height: min(88dvh, 900px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: rise 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  border: 1px solid var(--border);
}

@keyframes rise {
  from { transform: translateY(12px); opacity: 0; }
  to { transform: none; opacity: 1; }
}

.modal.wide { max-width: 860px; }

.modal-head {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--surface-2);
}

.modal-head .kicker {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-3);
  margin-bottom: 4px;
}

.modal-head h2 {
  font-size: 18px;
  word-break: break-word;
}

.modal-body {
  padding: 16px 20px;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  flex: 1;
  min-height: 0;
}

.modal-foot {
  padding: 12px 20px calc(14px + var(--safe-b));
  display: flex;
  gap: 10px;
  justify-content: flex-end;
  flex-wrap: wrap;
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  background: var(--surface-2);
}

.modal-foot .btn { min-height: 40px; }

.opt {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 13px 15px;
  margin-bottom: 10px;
  transition: background 0.14s, border-color 0.14s;
  color: inherit;
  min-height: var(--tap);
}

.opt:last-child { margin-bottom: 0; }
.opt:hover:not(:disabled) {
  border-color: var(--olive-2);
  background: var(--olive-soft);
}
.opt:disabled { opacity: 0.4; cursor: not-allowed; }
.opt .o-label {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
}
.opt .o-hint {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.5;
}
.opt .o-hint .up { color: var(--olive); }
.opt .o-hint .down { color: var(--red); }
.opt.risky { border-left: 3px solid var(--red); }

/* ---------- 结算 ---------- */
.grade-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 58px;
  height: 58px;
  border-radius: 50%;
  font-size: 26px;
  font-weight: 600;
  flex-shrink: 0;
}

.grade-S { background: var(--gold-soft); color: var(--gold); border: 2px solid var(--gold); }
.grade-A { background: var(--olive-soft); color: var(--olive); border: 2px solid var(--olive-2); }
.grade-B { background: var(--blue-soft); color: var(--blue); border: 2px solid #7ea3c8; }
.grade-C { background: var(--bg-alt); color: var(--text-2); border: 2px solid var(--border-strong); }
.grade-D { background: var(--red-soft); color: var(--red); border: 2px solid #d09b93; }

.result-head {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}

.result-head .r-text h3 { font-size: 16px; margin-bottom: 3px; }
.result-head .r-text p {
  font-size: 12.5px;
  color: var(--text-3);
}

.reward-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.reward {
  font-size: 12.5px;
  padding: 5px 11px;
  border-radius: 99px;
  background: var(--olive-soft);
  color: var(--olive);
  border: 1px solid #cfdcc6;
  line-height: 1.4;
}

.reward.bad {
  background: var(--red-soft);
  color: var(--red);
  border-color: #e8c9c3;
}
.reward.gold {
  background: var(--gold-soft);
  color: #7a5f1c;
  border-color: #e6d9b4;
}

.narrative {
  font-size: 13.5px;
  color: var(--text-2);
  line-height: 1.75;
  padding: 14px 16px;
  background: var(--surface-2);
  border-left: 3px solid var(--border-strong);
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-bottom: 16px;
}

/* ---------- 技能树 ---------- */
.branch { margin-bottom: 20px; }
.branch:last-child { margin-bottom: 0; }

.branch-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 9px;
  flex-wrap: wrap;
}

.branch-head h3 { font-size: 14px; }
.branch-head span {
  font-size: 11.5px;
  color: var(--text-3);
}

.skill-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.skill-row {
  display: flex;
  align-items: center;
  gap: 10px 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  flex-wrap: wrap;
}

.skill-row .s-name {
  flex: 1 1 140px;
  min-width: 0;
  font-size: 13px;
  line-height: 1.4;
}

.skill-lv {
  display: flex;
  gap: 3px;
  flex-shrink: 0;
}

.skill-lv i {
  width: 18px;
  height: 18px;
  border-radius: 4px;
  background: var(--bg-alt);
  border: 1px solid var(--border-strong);
  font-style: normal;
  font-size: 10px;
  line-height: 16px;
  text-align: center;
  color: var(--text-3);
}

.skill-lv i.on {
  background: var(--olive);
  border-color: var(--olive);
  color: #fff;
}

.skill-row .s-cost {
  font-size: 12px;
  color: var(--text-3);
  min-width: 72px;
  text-align: right;
  flex-shrink: 0;
}

.skill-row .s-btn { flex-shrink: 0; margin-left: auto; }

.skill-row .s-btn button {
  border: 1px solid var(--border-strong);
  background: var(--surface);
  border-radius: 7px;
  padding: 6px 14px;
  font-size: 12px;
  min-height: 36px;
}

.skill-row .s-btn button:hover:not(:disabled) {
  background: var(--olive-soft);
  border-color: var(--olive-2);
}
.skill-row .s-btn button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* ---------- 履历 ---------- */
.timeline {
  position: relative;
  padding-left: 22px;
}

.timeline::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 6px;
  bottom: 6px;
  width: 1px;
  background: var(--border-strong);
}

.tl-item {
  position: relative;
  padding-bottom: 14px;
}
.tl-item:last-child { padding-bottom: 0; }

.tl-item::before {
  content: "";
  position: absolute;
  left: -21px;
  top: 6px;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--border-strong);
}

.tl-item.rank::before {
  border-color: var(--olive);
  background: var(--olive);
}
.tl-item.gold::before {
  border-color: var(--gold);
  background: var(--gold);
}
.tl-item.bad::before {
  border-color: var(--red);
  background: var(--red);
}

.tl-year {
  font-size: 11px;
  color: var(--text-3);
}
.tl-text { font-size: 13px; }

/* ---------- 角色创建：入伍登记 ---------- */
.setup-card .card-head { letter-spacing: 2px; }

.setup-body { padding-top: 6px; }

.setup-section {
  padding: 16px 0;
  border-bottom: 1px dashed var(--border);
}
.setup-section:last-of-type { border-bottom: none; }

.setup-sec-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}

.setup-sec-head h3 {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.sec-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: var(--olive);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.sec-meta {
  margin-left: auto;
  font-size: 12px;
  color: var(--olive);
  font-weight: 500;
}

.pts-badge {
  margin-left: auto;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--olive-soft);
  color: var(--olive);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pts-badge.low {
  background: var(--gold-soft);
  color: #7a5f1c;
}
.pts-badge.done {
  background: var(--olive);
  color: #fff;
}

.setup-name label {
  display: block;
  font-size: 12.5px;
  color: var(--text-2);
  margin-bottom: 6px;
}
.setup-name input {
  width: 100%;
  padding: 12px 14px;
  font-size: 16px; /* 防 iOS 聚焦缩放 */
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text);
}
.setup-name input:focus {
  outline: none;
  border-color: var(--olive-2);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(79, 111, 72, 0.15);
}

.alloc-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed var(--border);
}
.alloc-row:last-child { border-bottom: none; }
.alloc-row.has {
  background: linear-gradient(90deg, var(--olive-soft), transparent 70%);
  margin: 0 -8px;
  padding-left: 8px;
  padding-right: 8px;
  border-radius: 8px;
  border-bottom-color: transparent;
}

.alloc-main { flex: 1; min-width: 0; }

.alloc-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 2px;
}

.alloc-row .an {
  font-size: 13.5px;
  font-weight: 600;
}

.av-wrap {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  font-variant-numeric: tabular-nums;
}

.av-add {
  font-size: 11px;
  color: var(--olive);
  font-weight: 600;
}

.alloc-row .av {
  font-size: 16px;
  font-weight: 600;
  font-family: var(--mono);
  min-width: 1.6em;
  text-align: right;
}

.alloc-row .ad {
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.45;
  margin-bottom: 6px;
}
.alloc-row .ad .up { color: var(--olive); }
.alloc-row .ad .down { color: var(--red); }

.alloc-bar {
  height: 4px;
  background: var(--bg-alt);
  border-radius: 99px;
  overflow: hidden;
}
.alloc-bar i {
  display: block;
  height: 100%;
  background: var(--olive);
  border-radius: 99px;
  transition: width 0.25s ease;
}

.alloc-ctrl {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.alloc-ctrl button {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: var(--surface);
  font-size: 18px;
  line-height: 1;
  color: var(--text-2);
}

.alloc-ctrl button:hover:not(:disabled) {
  background: var(--olive-soft);
  border-color: var(--olive-2);
}
.alloc-ctrl button:active:not(:disabled) { transform: scale(0.96); }
.alloc-ctrl button:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* 入伍方式卡 */
.enlist-pick {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.enlist-card {
  text-align: left;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  padding: 12px 14px;
  transition: background 0.14s, border-color 0.14s, box-shadow 0.14s;
  color: inherit;
  min-height: var(--tap);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.enlist-card:hover {
  border-color: var(--olive-2);
  background: #fff;
}
.enlist-card.on {
  border-color: var(--olive);
  background: var(--olive-soft);
  box-shadow: inset 0 0 0 1px var(--olive);
}

.ec-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.ec-name {
  font-size: 13.5px;
  font-weight: 600;
}
.ec-check {
  font-size: 10.5px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--olive);
  color: #fff;
  flex-shrink: 0;
}
.ec-desc {
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.5;
  flex: 1;
}
.ec-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.ec-meta {
  font-size: 11px;
  color: var(--olive);
  line-height: 1.4;
}

.mod-chip {
  font-size: 10.5px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--bg-alt);
  color: var(--text-2);
  border: 1px solid var(--border);
}
.mod-chip.up {
  background: var(--olive-soft);
  color: var(--olive);
  border-color: #cfdcc6;
}
.mod-chip.down {
  background: var(--red-soft);
  color: var(--red);
  border-color: #e8c9c3;
}

/* 特质选择 */
.trait-pick {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
}

.trait-opt {
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: var(--radius);
  padding: 10px 12px;
  text-align: left;
  transition: background 0.14s, border-color 0.14s;
  color: inherit;
  min-height: var(--tap);
}

.trait-opt:hover { border-color: var(--olive-2); }
.trait-opt.on {
  border-color: var(--olive);
  background: var(--olive-soft);
  box-shadow: inset 0 0 0 1px var(--olive);
}
.trait-opt .t-name {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 2px;
}
.trait-opt.on .t-name { color: var(--olive); }
.trait-opt .t-desc {
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1.45;
}

.setup-actions {
  margin-top: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.setup-actions-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.setup-actions-row .btn.primary { flex: 1 1 160px; }

.setup-note {
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-3);
  line-height: 1.5;
}

/* ========== 任务推演 ========== */
.task-steps {
  display: flex;
  gap: 6px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.task-step {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--text-3);
  padding: 4px 8px 4px 4px;
  border-radius: 99px;
  background: var(--bg-alt);
  border: 1px solid transparent;
}

.task-step i {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--border-strong);
  color: #fff;
  font-style: normal;
  font-size: 10px;
  font-weight: 600;
  flex-shrink: 0;
}

.task-step.on {
  background: var(--olive-soft);
  color: var(--olive);
  border-color: #cfdcc6;
  font-weight: 600;
}
.task-step.on i { background: var(--olive); }

.task-step.done {
  color: var(--text-2);
  background: var(--surface-2);
  border-color: var(--border);
}
.task-step.done i {
  background: var(--gold);
  color: #fff;
}

.deploy-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 14px;
  margin-bottom: 14px;
  background: var(--olive-soft);
  border-radius: var(--radius);
  color: var(--olive);
  flex-wrap: wrap;
}

.deploy-info {
  display: flex;
  align-items: baseline;
  gap: 6px;
  font-size: 13px;
}

.deploy-label { font-weight: 500; }
.deploy-left {
  font-size: 24px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.deploy-total {
  color: var(--text-3);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.deploy-pips {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.deploy-pip {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  background: rgba(58, 86, 54, 0.18);
  border: 1px solid rgba(58, 86, 54, 0.25);
}
.deploy-pip.on {
  background: var(--olive);
  border-color: var(--olive);
}

.fronts {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.front {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  background: var(--surface-2);
  transition: border-color 0.15s, background 0.15s;
}
.front.met {
  border-color: #cfdcc6;
  background: linear-gradient(180deg, #f3f7ef, var(--surface-2));
}

.front-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.front-info { flex: 1; min-width: 0; }

.front-name {
  font-size: 13.5px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.front-status {
  font-size: 10.5px;
  font-weight: 500;
  padding: 1px 7px;
  border-radius: 99px;
}
.front-status.ok {
  background: var(--olive);
  color: #fff;
}
.front-status.need {
  background: var(--gold-soft);
  color: #7a5f1c;
  border: 1px solid #e6d9b4;
}

.front-hint {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 2px;
  line-height: 1.45;
}

.front-track {
  height: 8px;
  background: var(--bg-alt);
  border-radius: 99px;
  overflow: hidden;
  margin-top: 10px;
  border: 1px solid var(--border);
}

.front-fill {
  height: 100%;
  background: #b9a05c;
  border-radius: 99px;
  transition: width 0.25s ease;
}
.front-fill.full { background: var(--olive); }

.front-meta {
  margin-top: 6px;
  font-size: 11px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

.preview {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 16px;
}

.preview-item {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.preview-item .pk {
  font-size: 11px;
  color: var(--text-3);
}
.preview-item .pv {
  font-size: 17px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.preview-item .pv.grade-S { color: var(--gold); }
.preview-item .pv.grade-A { color: var(--olive); }
.preview-item .pv.grade-B { color: var(--blue); }
.preview-item .pv.grade-C { color: var(--text-2); }
.preview-item .pv.grade-D { color: var(--red); }

.dec-progress {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  font-size: 12.5px;
  color: var(--text-2);
  font-weight: 500;
}

.reserve-chip {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 99px;
  background: var(--olive-soft);
  color: var(--olive);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.reserve-chip.empty {
  background: var(--bg-alt);
  color: var(--text-3);
}

.opt .o-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
}

/* ---------- 结局 ---------- */
.ending-hero {
  text-align: center;
  padding: 28px 20px 22px;
  background: linear-gradient(180deg, var(--surface-2), var(--gold-soft));
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.ending-hero .e-kicker {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--text-3);
  margin-bottom: 10px;
}

.ending-hero h2 {
  font-size: 26px;
  margin-bottom: 8px;
  letter-spacing: 2px;
}

.ending-hero .e-rank {
  font-size: 13px;
  color: var(--text-2);
  line-height: 1.5;
}

.ending-hero .e-star {
  width: 52px;
  height: 52px;
  margin: 0 auto 14px;
  background: var(--gold);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}

.ending-hero.tier-warn .e-star { background: var(--red); }
.ending-hero.tier-plain .e-star { background: var(--border-strong); }

.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}

.summary-cell {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 11px 13px;
}

.summary-cell .sc-k {
  font-size: 11px;
  color: var(--text-3);
  margin-bottom: 3px;
}
.summary-cell .sc-v {
  font-size: 16px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* ---------- 空状态 ---------- */
.empty {
  text-align: center;
  padding: 36px 16px;
  color: var(--text-3);
  font-size: 13px;
}

/* ================= 肩章 / 机会卡 / 任务推演 ================= */

.action.opp {
  border-color: #d9c68a;
  background: linear-gradient(180deg, #fdf8ea, #faf3e0);
}
.action.opp:hover:not(:disabled) {
  border-color: var(--gold);
  background: #faf1d9;
}
.action.opp .a-name { color: #7a5f1c; }

.hint-line {
  font-size: 11.5px;
  color: var(--text-3);
  margin-top: 10px;
  line-height: 1.6;
}

.need-tag {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--olive-soft);
  color: var(--olive);
  white-space: nowrap;
}
.need-tag.no {
  background: var(--red-soft);
  color: var(--red);
}

.fronts-mini {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-bottom: 16px;
}
.front-mini {
  display: flex;
  align-items: center;
  gap: 10px;
}
.front-mini .fm-name {
  font-size: 12px;
  color: var(--text-2);
  width: 84px;
  flex-shrink: 0;
}
.front-mini .front-track {
  flex: 1;
  margin-top: 0;
  min-width: 0;
}
.front-mini .fm-val {
  font-size: 12px;
  color: var(--text-3);
  width: 38px;
  text-align: right;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.dec-block {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 16px;
}
.dec-title {
  font-size: 11.5px;
  color: var(--text-3);
  letter-spacing: 1px;
  margin-bottom: 8px;
}
.dec-item {
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
}
.dec-item:last-child { border-bottom: none; }
.dec-q { font-size: 12px; color: var(--text-3); }
.dec-a {
  font-size: 13px;
  color: var(--olive);
  margin-top: 2px;
}

.promo-art {
  display: flex;
  justify-content: center;
  margin-bottom: 18px;
}
.e-insignia {
  display: flex;
  justify-content: center;
  margin-top: 16px;
}

/* 同期排名 */
.rank-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.rank-row {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 72px 82px 74px;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  font-size: 13px;
}

.rank-row.me {
  border-color: var(--olive);
  background: var(--olive-soft);
}
.rank-row .rk-pos {
  font-weight: 600;
  color: var(--text-3);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.rank-row.me .rk-pos { color: var(--olive); }
.rank-row .rk-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
}
.rank-row .rk-tag {
  font-size: 11px;
  color: var(--text-3);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rank-row .rk-rank {
  font-size: 12px;
  color: var(--olive);
}
.rank-row .rk-merit {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
  font-family: var(--mono);
  font-size: 12px;
}
.rank-row .rk-merit .rk-trend {
  font-style: normal;
  font-size: 10px;
  margin-left: 2px;
}
.rk-trend.up { color: var(--olive); }
.rk-trend.down { color: var(--red); }

.heat-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--border-strong);
  margin-left: 6px;
  vertical-align: middle;
}
.heat-dot.hot {
  background: var(--red);
  box-shadow: 0 0 0 2px rgba(161, 58, 46, 0.2);
}

.rel-tag {
  display: inline-block;
  font-size: 10px;
  padding: 0 6px;
  border-radius: 99px;
  margin-left: 6px;
  vertical-align: middle;
  font-weight: 500;
}
.rel-tag.ally {
  background: var(--olive-soft);
  color: var(--olive);
  border: 1px solid #cfdcc6;
}
.rel-tag.foe {
  background: var(--red-soft);
  color: var(--red);
  border: 1px solid #e8c9c3;
}

/* 动效 */
@keyframes pop {
  0% { transform: scale(0.4); opacity: 0; }
  60% { transform: scale(1.12); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.pop {
  animation: pop 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(154, 122, 40, 0.45); }
  50% { box-shadow: 0 0 0 10px rgba(154, 122, 40, 0); }
}
.ending-hero .e-star { animation: glow 1.8s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .pop,
  .ending-hero .e-star,
  .modal,
  .overlay,
  .merit-fill,
  .stat-fill,
  .front-fill {
    animation: none !important;
    transition: none !important;
  }
}

/* ================= 成长路线 ================= */
.route-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.route-card {
  display: block;
  width: 100%;
  text-align: left;
  border: 1px solid var(--border);
  border-left: 4px solid var(--olive);
  border-radius: var(--radius);
  background: var(--surface-2);
  padding: 14px 16px;
  transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
  color: inherit;
}

.route-card:hover {
  background: #fff;
  transform: translateX(3px);
  box-shadow: var(--shadow);
}

.rc-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}
.rc-name {
  font-size: 15px;
  font-weight: 600;
}
.rc-tag {
  font-size: 11.5px;
  color: var(--text-3);
}
.rc-desc {
  font-size: 12.5px;
  color: var(--text-2);
  margin: 5px 0 9px;
}
.rc-line {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.7;
}
.rc-line b {
  color: var(--text);
  font-weight: 500;
  margin-right: 8px;
}
.rc-motto {
  font-size: 12px;
  color: var(--gold);
  margin-top: 8px;
}

.route-meta {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin-top: 14px;
}
.rm-row {
  display: flex;
  gap: 12px;
  font-size: 12.5px;
}
.rm-row b {
  color: var(--text-2);
  font-weight: 500;
  width: 68px;
  flex-shrink: 0;
}
.rm-row span { color: var(--text); }

.route-gates {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.route-gate {
  display: flex;
  align-items: center;
  gap: 10px 14px;
  padding: 8px 13px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  font-size: 12.5px;
  flex-wrap: wrap;
}
.route-gate .rg-rank {
  width: 44px;
  color: var(--olive);
  font-weight: 600;
  flex-shrink: 0;
}
.route-gate .rg-need { color: var(--text-2); }

.route-switch-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.route-switch {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  text-align: left;
  transition: background 0.14s, border-color 0.14s;
  color: inherit;
  min-height: var(--tap);
  flex-wrap: wrap;
}
.route-switch:hover:not(:disabled) {
  border-color: var(--olive-2);
  background: var(--olive-soft);
}
.route-switch:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.route-switch .rs-name {
  font-size: 13px;
  font-weight: 500;
}
.route-switch .rs-cost {
  font-size: 11.5px;
  color: var(--text-3);
}

.branch.route-branch {
  border-left: 3px solid var(--olive);
  padding-left: 12px;
}
.route-badge {
  font-size: 10.5px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--olive-soft);
  color: var(--olive);
  font-weight: 400;
  margin-left: 6px;
  vertical-align: middle;
}

/* ================= 家训 / 成就 ================= */
.motto-pick {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 9px;
}

.motto-opt {
  text-align: left;
  border: 1px solid #e6d9b4;
  border-radius: var(--radius);
  background: var(--gold-soft);
  padding: 11px 13px;
  transition: border-color 0.14s, box-shadow 0.14s;
  color: inherit;
  min-height: var(--tap);
}
.motto-opt:hover { border-color: var(--gold); }
.motto-opt.on {
  border-color: var(--gold);
  background: #f3e8cb;
  box-shadow: inset 0 0 0 1px var(--gold);
}
.mo-name {
  font-size: 13px;
  font-weight: 600;
  color: #7a5f1c;
  margin-bottom: 3px;
}
.mo-desc {
  font-size: 11.5px;
  color: var(--text-2);
  line-height: 1.5;
}

.mini-tag {
  font-size: 10.5px;
  padding: 1px 7px;
  border-radius: 99px;
  background: var(--gold-soft);
  color: #7a5f1c;
  font-weight: 400;
  margin-left: 5px;
  vertical-align: middle;
  white-space: nowrap;
}

.achv-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.achv-row {
  display: grid;
  grid-template-columns: 26px minmax(72px, auto) 1fr;
  align-items: baseline;
  gap: 6px 8px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  font-size: 12.5px;
  opacity: 0.55;
}

.achv-row.on {
  opacity: 1;
  border-color: #e6d9b4;
  background: var(--gold-soft);
}
.achv-row .ar-mark {
  color: var(--border-strong);
  font-size: 14px;
  text-align: center;
}
.achv-row.on .ar-mark { color: var(--gold); }
.achv-row .ar-name { font-weight: 500; }
.achv-row .ar-desc {
  color: var(--text-3);
  font-size: 11.5px;
  line-height: 1.45;
}

.s-unlock {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 99px;
  background: var(--bg-alt);
  color: var(--text-3);
  font-weight: 400;
  margin-left: 5px;
  vertical-align: middle;
  white-space: nowrap;
}
.s-unlock.on {
  background: var(--olive);
  color: #fff;
}
.s-unlock-note {
  font-size: 11px;
  color: var(--olive);
  margin-top: 7px;
  padding: 7px 10px;
  background: var(--olive-soft);
  border-radius: 6px;
  line-height: 1.6;
}

/* ================= 部队卡 / 生涯档案 / 存档 ================= */
.unit-name {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 1px;
  margin-bottom: 2px;
}
.unit-meta {
  font-size: 11.5px;
  color: var(--text-3);
  margin-bottom: 10px;
  line-height: 1.5;
}

.prof-block {
  margin-bottom: 16px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
}
.prof-title {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-2);
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.prof-title span {
  color: var(--olive);
  font-variant-numeric: tabular-nums;
}
.spark {
  display: block;
  background: linear-gradient(180deg, #fff, #f7f5ee);
  border-radius: 6px;
}

.save-box {
  width: 100%;
  min-height: 120px;
  padding: 10px 12px;
  font-size: 12px;
  font-family: var(--mono);
  line-height: 1.5;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text);
  resize: vertical;
  word-break: break-all;
}
.save-box:focus {
  outline: none;
  border-color: var(--olive-2);
  box-shadow: 0 0 0 3px rgba(79, 111, 72, 0.15);
}

.save-msg {
  margin-top: 10px;
  font-size: 12.5px;
  min-height: 1.4em;
}
.save-msg.ok { color: var(--olive); }
.save-msg.bad { color: var(--red); }

.more-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.more-grid .opt { margin-bottom: 0; }

@media (min-width: 640px) {
  .more-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
}

.slot-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.slot-row {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 6px 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  align-items: center;
}

.slot-row.active {
  border-color: var(--olive);
  background: var(--olive-soft);
}

.slot-row.empty { opacity: 0.85; }

.slot-id {
  font-size: 12px;
  font-weight: 600;
  color: var(--olive);
}

.slot-info {
  font-size: 12px;
  color: var(--text-2);
  line-height: 1.45;
  min-width: 0;
}

.slot-btns {
  grid-column: 1 / -1;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.slot-btns .btn {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 12px;
}

@media (min-width: 640px) {
  .slot-row {
    grid-template-columns: 72px 1fr auto;
  }
  .slot-btns {
    grid-column: auto;
    justify-content: flex-end;
  }
}

/* ================= 勋章墙 ================= */
.medal-wall { padding-top: 4px; }

.medal-section { margin-bottom: 22px; }
.medal-section:last-child { margin-bottom: 0; }

.medal-sec-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.medal-sec-head h3 {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 2px;
  color: var(--olive);
}
.medal-sec-head span {
  font-size: 12px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

.medal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(132px, 1fr));
  gap: 10px;
}

.medal-cell {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  padding: 12px 10px 10px;
  text-align: center;
  min-height: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.medal-cell.on {
  background: linear-gradient(180deg, #fbf8ef, var(--surface-2));
  box-shadow: inset 0 0 0 1px rgba(201, 162, 39, 0.15);
}
.medal-cell.on.tier-gold { border-color: #e0c86a; }
.medal-cell.on.tier-silver { border-color: #c5cdd6; }
.medal-cell.on.tier-bronze { border-color: #d4b08a; }

.medal-cell.off { opacity: 0.72; }
.medal-cell.off .medal-name { color: var(--text-3); }

.medal-art {
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 2px;
}
.medal-cell.on .medal-art svg {
  filter: drop-shadow(0 2px 4px rgba(31, 30, 26, 0.18));
}

.medal-lock {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px dashed var(--border-strong);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-3);
  font-size: 16px;
  background: var(--bg-alt);
}

.medal-name {
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.3;
}

.medal-desc {
  font-size: 10.5px;
  color: var(--text-3);
  line-height: 1.4;
  flex: 1;
}

.medal-when {
  font-size: 10px;
  color: var(--gold);
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 768px) {
  .medal-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }
  .medal-cell {
    min-height: 140px;
    padding: 10px 8px;
  }
  .medal-art svg { width: 48px; height: 54px; }
}

@media (max-width: 380px) {
  .medal-grid { grid-template-columns: 1fr 1fr; }
}

/* ================= NPC 关系网 ================= */
.npc-groups {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.npc-group {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.npc-group-head {
  padding: 8px 12px;
  background: var(--surface-2);
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12px;
  flex-wrap: wrap;
}
.npc-group-head span:first-child {
  font-weight: 600;
  color: var(--olive);
}
.npc-group-head span:last-child { color: var(--text-3); }

.npc-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-bottom: 1px dashed var(--border);
  background: #fff;
}
.npc-row:last-child { border-bottom: none; }

.npc-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--olive-soft);
  color: var(--olive);
  font-size: 15px;
  font-weight: 600;
  flex-shrink: 0;
}

.npc-main {
  flex: 1;
  min-width: 0;
}
.npc-name {
  font-size: 13px;
  font-weight: 500;
}
.npc-name span {
  font-size: 10.5px;
  color: var(--text-3);
  font-weight: 400;
  margin-left: 6px;
}
.npc-rel {
  font-size: 11px;

  margin-top: 2px;
}
.npc-track {

  border-radius: 99px;

.npc-track div {

.npc-growth {
  width: 76px;
  text-align: right;
  flex-shrink: 0;
}
.npc-growth span {
  display: block;
  font-size: 10px;
  color: var(--text-3);
}
.npc-growth b {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-2);
}
.npc-growth em {
  display: block;
  font-size: 10px;
  color: var(--gold);
  font-style: normal;

/* ================= 平板 ================= */
@media (max-width: 1024px) {
  .layout {
    grid-template-columns: 260px minmax(0, 1fr);
  }
  .topbar {
    flex-wrap: wrap;
  }
  .topbar-actions {
    width: 100%;
    justify-content: flex-start;
  }
}

/* ================= 手机 ================= */
@media (max-width: 768px) {
  html, body { font-size: 15px; }

  #app {
    padding:
      calc(10px + var(--safe-t))
      calc(12px + var(--safe-r))
      calc(100px + var(--safe-b))
      calc(12px + var(--safe-l));
  }

  .card { box-shadow: none; }
  .action:hover:not(:disabled) { transform: none; }
  .merit-fill { transition: none; }
  .stat-fill { transition: none; }
  .front-fill { transition: none; }

  .topbar {
    flex-direction: column;
    align-items: stretch;
    gap: 10px;
    padding: 12px;
    border-radius: 12px;
  }

  .topbar-id {
    justify-content: space-between;
  }

  .brand {
    min-width: 0;
  }

  .brand-text h1 { font-size: 16px; }

  /* 军龄条：横向滑动 */
  .career {
    display: flex;
    flex-wrap: nowrap;
    gap: 8px;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
    margin: 0 -2px;
    scrollbar-width: none;
  }
  .career::-webkit-scrollbar { display: none; }

  .career-item {
    flex: 0 0 auto;
    padding: 6px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-width: 0;
  }
  .career-item .v {
    max-width: none;
    font-size: 13px;
  }
  .career-item .v .mini-tag { display: none; }

  .insignia {
    margin-left: 0;
    align-self: center;
    flex: 0 0 auto;
  }
  .insignia svg {
    width: 64px !important;
    height: auto !important;
  }

  /* 功能按钮：横向滑动胶囊 */
  .topbar-actions {
    display: flex;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 6px;
    width: 100%;
    padding-bottom: 2px;
    margin: 0 -2px;
    scrollbar-width: none;
  }
  .topbar-actions::-webkit-scrollbar { display: none; }

  .topbar-actions .btn {
    flex: 0 0 auto;
    min-height: 40px;
    padding: 8px 12px;
    font-size: 12.5px;
    border-radius: 999px;
  }

  .merit-wrap { margin-top: 10px; }
  .merit-label {
    flex-direction: column;
    gap: 2px;
  }
  .merit-label span:last-child { text-align: left; }

  .layout {
    grid-template-columns: 1fr;
    gap: 12px;
    margin-top: 12px;
  }

  /* 主区优先，属性区在下 */
  .sidebar { order: 2; }
  .main { order: 1; }

  .card { border-radius: 12px; }
  .card-body { padding: 12px; }
  .card-head { padding: 10px 12px; }

  /* 回合条：上下两行，主操作更易点 */
  .turn-head {
    flex-direction: column;
    align-items: stretch;
  }

  .ap-box {
    justify-content: space-between;
  }

  .ap-box .btn {
    flex: 1 1 auto;
    min-height: var(--tap);
  }
  .ap-box .btn.primary { flex: 1.4 1 auto; }

  .action-grid {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .action {
    min-height: 84px;
    padding: 12px;
  }

  .log-list { max-height: 220px; }

  /* 弹窗：底部抽屉，贴合全面屏 */
  .overlay {
    align-items: flex-end;
    padding: 0;
    background: rgba(31, 30, 26, 0.55);
  }

  .modal,
  .modal.wide {
    max-width: none;
    width: 100%;
    max-height: min(92dvh, 100%);
    border-radius: 16px 16px 0 0;
    border-bottom: none;
    animation: sheet 0.24s cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes sheet {
    from { transform: translateY(24px); opacity: 0.6; }
    to { transform: none; opacity: 1; }
  }

  .modal-head {
    padding: 14px 16px 12px;
    position: relative;
  }
  .modal-head::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 4px;
    border-radius: 99px;
    background: var(--border-strong);
    opacity: 0.7;
  }
  .modal-head h2 { font-size: 17px; }

  .modal-body { padding: 14px 16px; }

  .modal-foot {
    padding: 10px 16px calc(12px + var(--safe-b));

    width: 40px;
    height: 40px;
  }

  .enlist-pick {
    grid-template-columns: 1fr;
  }
  .trait-pick {
    grid-template-columns: 1fr 1fr;
  }
  .setup-actions {
    position: sticky;
    bottom: 0;
    background: linear-gradient(180deg, transparent, var(--surface) 28%);
    padding-top: 18px;
    margin-top: 4px;
    z-index: 2;
  }
  .setup-actions-row .btn.primary {
    flex: 1.4 1 auto;
    min-height: var(--tap);
  }
  .setup-actions-row .btn:not(.primary) {
    min-height: var(--tap);
  }

  .task-steps {
    gap: 4px;
  }
  .task-step span {
    display: none;
  }
  .task-step.on span,
  .task-step.done span {
    display: inline;
  }
  .task-step {
    padding: 3px 7px 3px 3px;
    font-size: 11px;
  }

  .deploy-bar {
    align-items: flex-start;
    flex-direction: column;
    gap: 8px;
  }

  .front-top {
    align-items: flex-start;
  }
  .front-top .alloc-ctrl button {
    width: 40px;
    height: 40px;
  }

  .preview {
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .preview-item {
    padding: 8px 8px;
  }
  .preview-item .pv { font-size: 15px; }

  .rank-row {
    grid-template-columns: 32px minmax(0, 1fr) auto;

      "pos name rank"
      "pos tag merit";

    padding: 10px 12px;

  }

  .motto-pick {

  .route-switch {
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }

  .npc-row { gap: 10px; }
  .npc-growth { width: 64px; }

  .disclaimer {
    margin-top: 16px;
    font-size: 10.5px;
  }

/* 小屏手机（iPhone SE 等） */
@media (max-width: 380px) {
  .action-grid { grid-template-columns: 1fr; }
  .action { min-height: 0; }
  .brand-text p { display: none; }
  .preview { gap: 6px; }
  .summary-grid {
    grid-template-columns: 1fr 1fr;
  }
  .trait-pick { grid-template-columns: 1fr; }
}

@media (max-width: 768px) and (orientation: landscape) {

    max-height: 96dvh;

  .overlay {
    align-items: center;
    padding: 8px 12px;
  }
}

/* 粗指针 / 无 hover 设备：去掉抬升，保证点击稳定 */
@media (hover: none) {
  .action:hover:not(:disabled) { transform: none; }
  .route-card:hover { transform: none; }
}

/* 桌面大屏：略收紧字号，信息更密 */
@media (min-width: 1100px) {
  html, body { font-size: 14px; }
  .action { min-height: 68px; }
}

    if (y >= ERAS[i].from && y <= ERAS[i].to) return ERAS[i];

}

/* ============================================================
   《将星之路》游戏引擎
   时间轴 / 状态 / 行动 / 机会卡 / 同期竞争 / 任务推演 / 晋升 / 结局
   ============================================================ */

/* ---------- 时间轴 ---------- */
const TIMELINE = (function () {
  const seq = [];
  STAGE_ORDER.forEach(k => {
    const st = STAGES[k];
    const years = st.to - st.from + 1;
    if (st.turns === years * 2) {
      for (let i = 0; i < st.turns; i++) {
        const y = st.from + Math.floor(i / 2);
        const half = i % 2 === 0 ? '上半年' : '下半年';
        seq.push({ stage:k, idx:i, year:y, label:'第 ' + y + ' 年 · ' + half, short:'第' + y + '年' });
      }
    } else {
      for (let i = 0; i < st.turns; i++) {
        const y = st.from + i;
        seq.push({ stage:k, idx:i, year:y, label:'第 ' + y + ' 年', short:'第' + y + '年' });
      }
    }
  });
  return seq;
})();

/* ---------- 工具 ---------- */
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function rnd(a, b) { return a + Math.random() * (b - a); }
function ri(a, b) { return Math.floor(rnd(a, b + 1)); }

const ATTR_NAME = {}; ATTRS.forEach(a => ATTR_NAME[a.key] = a.name);
const DV_NAME = { military:'军事素养', political:'政治素养', professional:'专业能力', discipline:'作风纪律' };
const ST_NAME = { morale:'士气', health:'健康', prestige:'威望', trust:'首长信任', bond:'搭档默契', family:'家庭' };

/* ---------- 纪律等级（阶跃函数，一票否决） ---------- */
function discGrade(v) {
  if (v >= 88) return { name: '优秀', mul: 1.15, freeze: false };
  if (v >= 75) return { name: '良好', mul: 1.00, freeze: false };
  if (v >= 62) return { name: '合格', mul: 0.90, freeze: false };
  return { name: '不合格', mul: 0, freeze: true };
}

/* ---------- 特质系数 ---------- */
function traitMul(s, key) {
  let m = 1;
  s.traits.forEach(t => {
    const fx = (TRAIT_MAP[t] || {}).fx;
    if (fx && fx[key]) m += fx[key];
  });
  return Math.max(0.2, m);
}
function traitBonus(s, task) {
  let b = 0;
  s.traits.forEach(t => {
    const fx = (TRAIT_MAP[t] || {}).fx || {};
    if (fx.taskBonus) b += fx.taskBonus;
    if (fx.combatBonus && task.kind === 'combat') b += fx.combatBonus;
    if (fx.contestBonus && task.kind === 'contest') b += fx.contestBonus;
  });
  return b;
}
function traitRisk(s) {
  let r = 0;
  s.traits.forEach(t => {
    const fx = (TRAIT_MAP[t] || {}).fx || {};
    if (fx.riskAdd) r += fx.riskAdd;
  });
  return r;
}

/* ---------- 难度 / 部队 / 时代 ---------- */
function diffOf(s) {
  return DIFFICULTIES[(s && s.difficulty) || 'normal'] || DIFFICULTIES.normal;
}

function unitTierOf(stage) {
  return UNIT_TIERS.find(u => u.stage === stage) || UNIT_TIERS[0];
}

/* ---------- 职务 ---------- */
function getPosition(s) {
  return POSITION_MAP[s.positionId] || POSITION_MAP.p_soldier;
}

function positionTypeOfRoute(route) {
  if (route === 'political') return 'pol';
  if (route === 'staff') return 'stf';
  if (route === 'command') return 'line';
  return null;
}

function canHoldPosition(s, p) {
  if (stageIndex(s.stage) < p.minStage) return false;
  if (s.rankIdx < p.minRank || s.rankIdx > p.maxRank + 1) return false;
  // 路线限定：未选路线时只走军士通用岗；选定后优先本路线
  if (p.route) {
    if (!s.route) return false;
    if (p.route !== s.route) return false;
  }
  if (p.type === 'nco' && s.rankIdx >= 9 && p.level < 3) return false; // 当军官后不再任班长类
  if (p.type !== 'nco' && s.rankIdx < 9 && p.level >= 4) return false;
  return true;
}

/* 挑选当前可任的最佳职务（级别高、匹配路线） */
function bestPositionFor(s) {
  const routeType = positionTypeOfRoute(s.route);
  let best = null;
  POSITIONS.forEach(p => {
    if (!canHoldPosition(s, p)) return;
    if (!best) { best = p; return; }
    // 优先本路线类型，其次级别
    const scoreP = p.level * 10 + (routeType && p.type === routeType ? 20 : 0) + (p.type === 'nco' && s.rankIdx < 9 ? 5 : 0);
    const scoreB = best.level * 10 + (routeType && best.type === routeType ? 20 : 0) + (best.type === 'nco' && s.rankIdx < 9 ? 5 : 0);
    if (scoreP > scoreB) best = p;
  });
  return best || POSITION_MAP.p_soldier;
}

function applyPosition(s, pos, silent) {
  if (!pos) return false;
  if (s.positionId === pos.id) return false;
  const from = getPosition(s);
  s.positionId = pos.id;
  s.positionYear = s.year;
  if (pos.unitSize && s.unit) {
    if (pos.unitSize > (s.unit.size || 0)) {
      s.unit.size = pos.unitSize;
      s.unit.cohesion = clamp(s.unit.cohesion - 3, 0, 100);
    }
  }
  if (!silent) {
    pushLog(s, '职务任命', '被任命为' + pos.name + (from && from.id !== pos.id ? '（原' + from.name + '）' : ''), 'gold');
    pushHistory(s, '任' + pos.name, '职务调整：' + from.name + ' → ' + pos.name, 'rank');
  }
  return true;
}

function reviewPosition(s, silent) {
  const best = bestPositionFor(s);
  const cur = getPosition(s);
  // 仅在可任更高级别或类型更贴合时调整
  if (!best) return false;
  const routeType = positionTypeOfRoute(s.route);
  const better =
    best.level > cur.level ||
    (best.level === cur.level && routeType && best.type === routeType && cur.type !== routeType);
  if (!better) return false;
  // 不是自动连跳太多级：最多 +2
  if (best.level > cur.level + 2) {
    const step = POSITIONS
      .filter(p => canHoldPosition(s, p) && p.level === cur.level + 1)
      .sort((a, b) => {
        const sa = a.level * 10 + (routeType && a.type === routeType ? 20 : 0);
        const sb = b.level * 10 + (routeType && b.type === routeType ? 20 : 0);
        return sb - sa;
      })[0];
    return applyPosition(s, step || best, silent);
  }
  return applyPosition(s, best, silent);
}

function positionMeritMul(s) {
  return (getPosition(s) || {}).meritMul || 1;
}

function initUnit(s) {
  const tier = unitTierOf(s.stage || 'recruit');
  s.unit = {
    name: UNIT_NAME_POOL[Math.floor(Math.random() * UNIT_NAME_POOL.length)],
    tier: tier.name,
    size: tier.size,
    cohesion: 62,
    training: 55,
    losses: 0,
    honor: 0
  };
}

function upgradeUnit(s) {
  if (!s.unit) initUnit(s);
  const tier = unitTierOf(s.stage);
  if (s.unit.tier === tier.name) return false;
  const up = tier.size > (s.unit.size || 0);
  s.unit.tier = tier.name;
  s.unit.size = tier.size;
  if (up) {
    s.unit.cohesion = clamp(s.unit.cohesion - 4, 0, 100);
    s.unit.training = clamp(s.unit.training - 6, 0, 100);
    pushLog(s, '部队扩编', '你所带的单位调整为「' + tier.name + '」，凝聚力与训练需要重新抓', 'gold');
  }
  return true;
}

function unitTick(s, opts) {
  if (!s.unit) initUnit(s);
  const u = s.unit;
  const d = diffOf(s);
  u.cohesion = clamp(u.cohesion - 0.7 * d.healthDecay, 0, 100);
  u.training = clamp(u.training - 0.5 * d.discDecay, 0, 100);
  if (s.st.morale >= 70) u.cohesion = clamp(u.cohesion + 0.4, 0, 100);
  if (s.dv.discipline >= 75) u.training = clamp(u.training + 0.3, 0, 100);
  if (opts && opts.losses) {
    u.losses += opts.losses;
    u.cohesion = clamp(u.cohesion - opts.losses * 2.5, 0, 100);
  }
  if (opts && opts.honor) {
    u.honor += opts.honor;
    u.cohesion = clamp(u.cohesion + opts.honor * 0.5, 0, 100);
  }
}

function eraOf(s) {
  return eraForYear(s.year || s.serviceYear || 1);
}

function recordCareerTrack(s) {
  if (!s.careerTrack) s.careerTrack = [];
  const row = {
    year: s.year, merit: Math.round(s.merit), rankIdx: s.rankIdx,
    prestige: Math.round(s.st.prestige), health: Math.round(s.st.health),
    unit: s.unit ? Math.round(s.unit.cohesion) : 0
  };
  const last = s.careerTrack[s.careerTrack.length - 1];
  if (last && last.year === s.year) s.careerTrack[s.careerTrack.length - 1] = row;
  else s.careerTrack.push(row);
  if (s.careerTrack.length > 80) s.careerTrack.shift();
}

/* ---------- 新游戏 ---------- */
function newGame(name, alloc, traits, opts) {
  const o = opts || {};
  const enlist = ENLIST_TYPES[o.enlist] || ENLIST_TYPES.conscript;
  const motto = o.motto && MOTTOS.find(m => m.id === o.motto) ? MOTTOS.find(m => m.id === o.motto) : null;

  const s = {
    name: name || '无名',
    slot: o.slot || getActiveSlot(),
    traits: traits.slice(),
    enlist: enlist.key,
    mottoId: motto ? motto.id : null,
    legacy: !!o.legacy,
    prename: o.prename || '',
    difficulty: DIFFICULTIES[o.difficulty] ? o.difficulty : 'normal',
    turnIndex: 0,
    year: 1, stage: 'recruit',
    age: 18, serviceYear: 1,
    attr: {}, dv: {}, st: {},
    merit: 0, rankIdx: enlist.startRank || 0, sp: enlist.sp || 0, spSpent: 0, skills: {},
    route: null, routeSwitched: false, routeChosenYear: 0,
    heir: 0, flags: {},
    usedEvents: [],
    notified: {},
    pendingEchoes: [],
    pendingChains: [],
    ap: 8, apMax: 8, usedActions: {},
    opportunities: [],
    rivals: [],
    rankPos: 1, rankTotal: 8, prevRankPos: 1,
    log: [], history: [],
    ended: false, ending: null, endReason: null,
    injuryCount: 0,
    careerTrack: [],
    lastEraId: eraForYear(1).id,
    sfxOn: true,
    familyInfo: {
      married: false,
      spouse: '',
      spouseTag: '',
      kids: 0,
      kidNames: [],
      tension: 0
    },
    allyId: null,
    nemesisId: null,
    positionId: 'p_soldier',
    positionYear: 1
  };

  ATTRS.forEach(a => { s.attr[a.key] = ATTR_BASE + (alloc[a.key] || 0); });
  s.dv = { military: 0, political: 0, professional: 0, discipline: 66 };
  s.dvBonus = { military: 0, political: 0, professional: 0 };
  STATES.forEach(x => { s.st[x.key] = x.init; });
  SKILL_BRANCHES.forEach(b => b.skills.forEach(k => { s.skills[k.key] = 0; }));

  // 入伍方式的先天修正
  if (enlist.mods) {
    for (const k in enlist.mods) {
      if (k === 'military') s.dvBonus.military += enlist.mods[k];
      else if (s.attr[k] != null) s.attr[k] += enlist.mods[k];
    }
  }
  if (enlist.flags) for (const k in enlist.flags) s.flags[k] = enlist.flags[k];
  s.enlistNeedMul = enlist.needMul || 1;

  // 家训（二周目继承）
  if (motto) {
    if (motto.mods) {
      for (const k in motto.mods) {
        if (k === 'all') ATTRS.forEach(a => { s.attr[a.key] += motto.mods.all; });
        else if (s.attr[k] != null) s.attr[k] += motto.mods[k];
      }
    }
    if (motto.merit) s.merit += motto.merit;
    if (motto.st) for (const k in motto.st) s.st[k] = clamp(s.st[k] + motto.st[k], 0, 100);
    if (motto.disc) s.dv.discipline = clamp(s.dv.discipline + motto.disc, 0, 110);
    if (motto.heirBonus) s.flags.heirBonus = true;
    if (motto.alloc) s.flags.bonusAlloc = motto.alloc;
  }
  if (traits.indexOf('stubborn') >= 0) s.attr.xinnian += 5;

  computeDerived(s);
  initRivals(s);
  initNPCs(s);
  initUnit(s);
  const t = TIMELINE[0];
  s.year = t.year; s.stage = t.stage;
  s.ap = STAGES[s.stage].ap; s.apMax = s.ap;
  recordCareerTrack(s);

  pushLog(s, '入伍', '你穿上了新军装，胸前别着大红花。' + (enlist.key !== 'conscript' ? '（' + enlist.name + '）' : '') + '　难度：' + DIFFICULTIES[s.difficulty].name, 'gold');
  pushHistory(s, '入伍', '以' + enlist.name + '身份入伍，授' + RANKS[s.rankIdx].name + '军衔　·　难度' + DIFFICULTIES[s.difficulty].name, 'rank');
  pushLog(s, '到职', '你被分配到' + s.unit.name + '（' + s.unit.tier + '）', '');
  if (motto) {
    pushLog(s, '家风', '你带着「' + motto.name + '」走进了军营。', 'gold');
    pushHistory(s, '继承家训', motto.name + ' —— ' + motto.desc, 'gold');
  }
  return s;
}

function computeDerived(s) {
  const a = s.attr;
  const b = s.dvBonus || { military: 0, political: 0, professional: 0 };
  s.dv.military = clamp((a.tibo * 0.4 + a.tongshuai * 0.4 + a.zhimou * 0.2) + b.military, 0, 110);
  s.dv.political = clamp((a.xinnian * 0.5 + a.meili * 0.3 + a.yizhi * 0.2) + b.political, 0, 110);
  s.dv.professional = clamp((a.zhimou * 0.5 + a.yizhi * 0.3 + a.tibo * 0.2) + b.professional, 0, 110);
}

/* ---------- 同期军官 AI ---------- */
const RIVAL_STYLE_KEYS = ['aggressive', 'balanced', 'political', 'technical', 'social'];

function initRivals(s) {
  const pool = RIVAL_NAMES.slice();
  s.rivals = [];
  for (let i = 0; i < 7; i++) {
    const name = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    const styleKey = RIVAL_STYLE_KEYS[Math.floor(Math.random() * RIVAL_STYLE_KEYS.length)];
    const style = RIVAL_STYLES[styleKey] || RIVAL_STYLES.balanced;
    s.rivals.push({
      name: name,
      tag: RIVAL_TAGS[Math.floor(Math.random() * RIVAL_TAGS.length)],
      style: styleKey,
      styleName: style.name,
      power: rnd(0.82, 1.18),
      merit: 0,
      rankIdx: 0,
      prestige: rnd(18, 32),
      discipline: rnd(58, 72),
      ambition: rnd(0.7, 1.3),
      heat: 0,          // 近期竞争热度
      lastEvent: '',
      lastGain: 0,
      trend: 0
    });
  }
}

/* 对手按阶段可晋升到的上限（略宽于玩家，制造压迫感） */
function rivalStageCap(s) {
  const st = STAGES[s.stage];
  return st ? st.maxRank : 1;
}

function tryPromoteRival(s, r) {
  const cap = rivalStageCap(s);
  const next = r.rankIdx + 1;
  if (next > cap || next >= RANKS.length) return false;
  const need = RANKS[next].need * (0.90 + 0.22 * (1 - r.ambition * 0.3));
  const style = RIVAL_STYLES[r.style] || RIVAL_STYLES.balanced;
  const gate = RANK_GATES[next];
  if (r.merit < need) return false;
  if (r.discipline < 55) return false;
  if (gate) {
    if (gate.prestige && r.prestige < gate.prestige * 0.92) return false;
    if (gate.disc && r.discipline < gate.disc * 0.95) return false;
    // 人脉型更容易绕过部分硬门槛
    if (r.style === 'political' && Math.random() > 0.75) return false;
  }
  // 性格加成：拼抢/人脉晋升略快
  if (Math.random() > 0.72 + style.promoBoost + (r.ambition - 1) * 0.1) return false;

  const from = RANKS[r.rankIdx].name;
  r.rankIdx = next;
  r.prestige = clamp(r.prestige + 2.5, 0, 100);
  r.heat = clamp(r.heat + 12, 0, 100);

  const to = RANKS[next].name;
  if (next > s.rankIdx) {
    pushLog(s, '同期动态', r.name + '先你一步晋升为' + to, 'bad');
    r.lastEvent = '晋升' + to;
    // 被反超会刺激玩家（信任/士气轻负反馈）
    if (s.merit > 0) s.st.morale = clamp(s.st.morale - 1.2, 0, 100);
  } else if (Math.random() < 0.45) {
    pushLog(s, '同期动态', r.name + '由' + from + '晋升为' + to, '');
    r.lastEvent = '晋升' + to;
  } else {
    r.lastEvent = '晋升' + to;
  }
  return true;
}

/* 对手个人事件：高光 / 翻车 / 与你对照 */
function rivalCareerEvent(s, r) {
  const style = RIVAL_STYLES[r.style] || RIVAL_STYLES.balanced;
  const roll = Math.random();
  if (roll < 0.035 + style.setback * 0.15) {
    // 翻车
    const loss = rnd(0.04, 0.12) * r.merit + 80;
    r.merit = Math.max(0, r.merit - loss);
    r.prestige = clamp(r.prestige - rnd(3, 8), 0, 100);
    r.discipline = clamp(r.discipline - rnd(1, 4), 40, 100);
    r.lastEvent = '受挫';
    r.heat = clamp(r.heat - 8, 0, 100);
    if (Math.random() < 0.55) {
      const line = RIVAL_EVENT_POOL.setback[Math.floor(Math.random() * RIVAL_EVENT_POOL.setback.length)];
      pushLog(s, '同期动态', r.name + line, '');
    }
  } else if (roll < 0.08) {
    // 高光
    const gain = rnd(0.03, 0.09) * Math.max(200, r.merit) + 120;
    r.merit += gain;
    r.prestige = clamp(r.prestige + rnd(2, 6), 0, 100);
    r.heat = clamp(r.heat + 10, 0, 100);
    r.lastEvent = '高光';
    if (Math.random() < 0.5) {
      const line = RIVAL_EVENT_POOL.boost[Math.floor(Math.random() * RIVAL_EVENT_POOL.boost.length)];
      pushLog(s, '同期动态', r.name + line, 'gold');
    }
  } else if (roll < 0.115 && Math.abs(r.merit - s.merit) < 1800) {
    // 与你贴身竞争
    r.heat = clamp(r.heat + 15, 0, 100);
    r.lastEvent = '与你较劲';
    const line = RIVAL_EVENT_POOL.vsPlayer[Math.floor(Math.random() * RIVAL_EVENT_POOL.vsPlayer.length)];
    if (Math.random() < 0.7) pushLog(s, '同期较劲', r.name + line, '');
    // 你被盯上时，若位次靠后会小幅压信任
    if (myRank(s).pos >= 4) s.st.trust = clamp(s.st.trust - 0.8, 0, 100);
  } else {
    r.lastEvent = '';
  }
}

/* 追赶 AI：落后玩家会加速，领先过多在标准难度下略收敛 */
function rivalCatchUpMul(s, r) {
  const gap = s.merit - r.merit;
  let m = 1;
  if (gap > 1500) {
    // 落后越多追得越紧（封顶，避免无脑反超）
    m += Math.min(0.28, gap / 28000);
  } else if (gap < -2000 && s.difficulty === 'normal') {
    m *= 0.94;
  }
  // 热度高的对手本回合更拼
  m *= 1 + (r.heat / 100) * 0.08;
  return m;
}

function tickRivals(s) {
  if (!s.rivals || !s.rivals.length) return;
  const base = RIVAL_GAIN[s.stage] || 300;
  const mul = diffOf(s).rivalMul;
  const mePos = myRank(s).pos;

  s.rivals.forEach(r => {
    if (!r.style) {
      r.style = RIVAL_STYLE_KEYS[Math.floor(Math.random() * RIVAL_STYLE_KEYS.length)];
      r.styleName = (RIVAL_STYLES[r.style] || RIVAL_STYLES.balanced).name;
      r.prestige = r.prestige != null ? r.prestige : rnd(18, 32);
      r.discipline = r.discipline != null ? r.discipline : rnd(58, 72);
      r.ambition = r.ambition != null ? r.ambition : rnd(0.7, 1.3);
      r.heat = r.heat || 0;
      r.rankIdx = r.rankIdx != null ? r.rankIdx : rivalRankIdx(r.merit || 0);
    }
    const style = RIVAL_STYLES[r.style] || RIVAL_STYLES.balanced;
    const catchUp = rivalCatchUpMul(s, r);
    // 你在第一时，前二的对手额外发力
    let pressure = 1;
    if (mePos === 1 && r.merit >= s.merit * 0.85) pressure = 1.06;
    // 对手随军衔获得“岗位”加成，跟上玩家的职务功勋系数
    const postMul = 1 + Math.min(0.28, (r.rankIdx || 0) * 0.016);

    const prev = r.merit;
    let gain = base * r.power * mul * style.meritMul * catchUp * pressure * postMul;
    gain *= rnd(1 - style.variance, 1 + style.variance);
    r.merit += gain;
    r.lastGain = Math.round(r.merit - prev);
    r.trend = r.lastGain;

    // 状态漂移
    if (r.style === 'political') r.prestige = clamp(r.prestige + rnd(0.2, 1.4), 0, 100);
    else r.prestige = clamp(r.prestige + rnd(-0.4, 1.0), 0, 100);
    if (r.style === 'aggressive') r.discipline = clamp(r.discipline + rnd(-1.2, 0.4), 40, 100);
    else r.discipline = clamp(r.discipline + rnd(-0.3, 0.9), 40, 100);

    // 热度自然回落
    r.heat = clamp(r.heat - 2.5, 0, 100);

    tryPromoteRival(s, r);
    rivalCareerEvent(s, r);
  });
}

/* 生成一张「同期竞争」事件卡（低概率入队） */

        { label: '若差距不大，先推荐他', hint: '搭档默契 +5 · 威望 +3 · 功勋 −100',
